<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0050aa">
    <meta name="description" content="Aplikace pro vedení směny v prodejně – plán lidí, palety, checklisty a poznámky z tréninku.">
    <title>Vedení směny</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230050aa'/%3E%3Ctext x='32' y='46' font-family='Arial,sans-serif' font-size='40' font-weight='bold' fill='%23fff000' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
    <style>
:root {
    --lidl-blue: #0050aa;
    --lidl-yellow: #fff000;
    --lidl-red: #e60a14;

    --bg: #f2f5f9;
    --bg-card: #ffffff;
    --bg-soft: #f7f9fc;
    --text: #16202c;
    --text-secondary: #5b6b7d;
    --accent: #0050aa;
    --accent-soft: #e5eefb;
    --border: #dde4ec;
    --success: #1f9254;
    --success-soft: #e4f5ec;
    --warning: #b8770a;
    --warning-soft: #fdf1dd;
    --danger: #d0342c;
    --danger-soft: #fceceb;
    --shadow: 0 1px 2px rgba(16, 32, 48, 0.06), 0 2px 8px rgba(16, 32, 48, 0.06);
    --radius: 12px;
    --shelf-frame: #8b95a3;
    --shelf-board: #b9c1cc;
    --shelf-back: #eef1f6;
}

[data-theme="dark"] {
    --bg: #131a22;
    --bg-card: #1c242e;
    --bg-soft: #232d39;
    --text: #eef3f8;
    --text-secondary: #a2b1c2;
    --accent: #6ea8f0;
    --accent-soft: #23334a;
    --border: #33404f;
    --success: #5ed195;
    --success-soft: #1d3a2c;
    --warning: #f0b95b;
    --warning-soft: #3a2f1a;
    --danger: #f58179;
    --danger-soft: #3d2321;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shelf-frame: #4a5867;
    --shelf-board: #3a4654;
    --shelf-back: #1a222c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
}

/* --- Hlavička ------------------------------------------------------------ */

.app-header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.7rem 1rem;
}

.brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }

.brand-mark {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--lidl-blue);
    color: var(--lidl-yellow);
    font-weight: 800;
    font-size: 1.3rem;
    border: 2px solid var(--lidl-yellow);
    flex-shrink: 0;
}

.brand h1 { font-size: 1.05rem; line-height: 1.2; }
.brand-sub { font-size: 0.78rem; color: var(--text-secondary); }

.icon-btn {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 0.45rem 0.65rem;
    font-size: 1.05rem;
    cursor: pointer;
}

.tabs {
    display: flex;
    gap: 0.3rem;
    overflow-x: auto;
    padding: 0 0.6rem 0.5rem;
    max-width: 1200px;
    margin: 0 auto;
    scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
    flex: 0 0 auto;
    background: none;
    border: 1px solid transparent;
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 0.4rem 0.8rem;
    font-size: 0.87rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}
.tab:hover { background: var(--bg-soft); color: var(--text); }
.tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* --- Layout -------------------------------------------------------------- */

.view {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 1rem 4rem;
}

.view-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 0.9rem;
}

.view-head h2 { font-size: 1.25rem; }
.view-head .subtitle { font-size: 0.85rem; color: var(--text-secondary); }

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem;
    margin-bottom: 0.9rem;
}

.card h3 {
    font-size: 0.95rem;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
}

.grid { display: grid; gap: 0.9rem; }
.grid-2 { grid-template-columns: 1fr; }
.grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (min-width: 760px) {
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .brand h1 { font-size: 1.2rem; }
}

/* --- Prvky --------------------------------------------------------------- */

.btn, .btn-secondary, .btn-danger, .btn-ghost {
    font: inherit;
    font-weight: 600;
    font-size: 0.87rem;
    border-radius: 10px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}
.btn { background: var(--accent); color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--bg-soft); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--accent-soft); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn-ghost { background: none; color: var(--text-secondary); padding: 0.3rem 0.45rem; }
.btn-ghost:hover { color: var(--text); background: var(--bg-soft); }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    box-shadow: var(--shadow);
}
.stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.stat-hint { font-size: 0.78rem; color: var(--text-secondary); }

.pill {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.76rem;
    color: var(--text-secondary);
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.pill.success { background: var(--success-soft); color: var(--success); border-color: var(--success); }
.pill.warning { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); }
.pill.danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

.row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 0.92rem; }
.row-sub { font-size: 0.8rem; color: var(--text-secondary); }
.row-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }

.empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 1.2rem 0.5rem;
    font-size: 0.9rem;
}

.muted { color: var(--text-secondary); font-size: 0.85rem; }
.tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }

/* --- Týdenní plán -------------------------------------------------------- */

.week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.9rem;
}
.week-label { font-weight: 700; font-size: 0.95rem; text-align: center; }

.day-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: var(--radius);
    padding: 0.8rem;
    box-shadow: var(--shadow);
    cursor: pointer;
}
.day-card:hover { border-color: var(--accent); }
.day-card.today { border-left-color: var(--lidl-blue); background: var(--accent-soft); }
.day-card.weekend { border-left-color: var(--warning); }

.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.day-name { font-weight: 700; font-size: 0.95rem; }
.day-date { font-size: 0.8rem; color: var(--text-secondary); }
.day-people { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.2rem; }
.day-person { font-size: 0.82rem; display: flex; justify-content: space-between; gap: 0.5rem; }
.day-person span:last-child { color: var(--text-secondary); flex-shrink: 0; }
.day-meta { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }

/* --- Formuláře ----------------------------------------------------------- */

.field { margin-bottom: 0.8rem; }
.field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; }
.field input, .field select, .field textarea {
    width: 100%;
    font: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-soft);
    color: var(--text);
}
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
}
.field-row { display: flex; gap: 0.6rem; }
.field-row > * { flex: 1; }
.field-hint { font-size: 0.76rem; color: var(--text-secondary); margin-top: 0.2rem; }

.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chip {
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.check-item {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
}
.check-item:last-child { border-bottom: none; }
.check-item input[type="checkbox"] { width: 20px; height: 20px; margin-top: 0.15rem; flex-shrink: 0; accent-color: var(--accent); }
.check-item label { font-size: 0.9rem; flex: 1; cursor: pointer; }
.check-item.done label { color: var(--text-secondary); text-decoration: line-through; }

/* --- Modální okno -------------------------------------------------------- */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 28, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 0;
}
@media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 1rem; }
}

.modal {
    background: var(--bg-card);
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 1rem;
    border: 1px solid var(--border);
}
@media (min-width: 640px) { .modal { border-radius: 16px; } }

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
}
.modal-head h3 { font-size: 1.05rem; }
.modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
.modal-actions .btn, .modal-actions .btn-secondary { flex: 1; justify-content: center; }

/* --- Poznámky ------------------------------------------------------------ */

.note-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem;
    box-shadow: var(--shadow);
    margin-bottom: 0.7rem;
}
.note-card.important { border-left: 4px solid var(--warning); }
.note-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: flex-start; }
.note-title { font-weight: 700; font-size: 0.98rem; }
.note-body { white-space: pre-wrap; font-size: 0.9rem; margin-top: 0.5rem; }
.note-meta { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.3rem; }

.search-bar { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
.search-bar input, .search-bar select {
    font: inherit;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text);
}
.search-bar input { flex: 1; min-width: 160px; }

.bar { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; background: var(--accent); }
.bar-fill.over { background: var(--danger); }
.bar-fill.done { background: var(--success); }

table.data { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
table.data th, table.data td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--border); }
table.data th { font-size: 0.76rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.03em; }
table.data td.num, table.data th.num { text-align: right; }
.table-scroll { overflow-x: auto; }

.toast {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg-card);
    padding: 0.6rem 1rem;
    border-radius: 999px;
    font-size: 0.87rem;
    z-index: 200;
    box-shadow: var(--shadow);
}

/* --- Tisk ---------------------------------------------------------------- */

@media print {
    .app-header, .btn, .btn-secondary, .btn-danger, .btn-ghost, .week-nav, .no-print { display: none !important; }
    body { background: #fff; }
    .view { padding: 0; max-width: none; }
    .card, .day-card, .note-card { box-shadow: none; break-inside: avoid; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
}

/* --- Plán prodejny --------------------------------------------------------- */

.map-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    margin-bottom: 0.7rem;
}
.map-toolbar select {
    font: inherit;
    font-size: 0.87rem;
    font-weight: 600;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text);
}

.map-wrap {
    overflow: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 0.9rem;
    max-height: 78vh;
}

.map-canvas {
    position: relative;
    margin: 0 auto;
    background-color: var(--bg-card);
    background-image:
        linear-gradient(to right, rgba(128, 145, 165, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(128, 145, 165, 0.12) 1px, transparent 1px);
    background-size: 20px 20px;
}

/* Obvodová zeď prodejny */
.map-canvas::before {
    content: '';
    position: absolute;
    inset: 1.6%;
    border: 3px solid var(--text-secondary);
    border-radius: 6px;
    opacity: 0.45;
    pointer-events: none;
}

.map-el {
    position: absolute;
    border: 2px solid #111;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    line-height: 1.15;
    font-weight: 600;
    padding: 2px;
    box-shadow: 0 1px 2px rgba(16, 32, 48, 0.18);
    transition: box-shadow 0.15s, transform 0.15s;
}
.map-el:hover { box-shadow: 0 3px 8px rgba(16, 32, 48, 0.28); z-index: 3; }

.map-icon { display: block; font-size: 1.25em; line-height: 1.1; }
.map-label.tiny { font-size: 1.1em; }
.map-photo-dot { font-size: 0.85em; margin-left: 0.15em; }
.map-wrap.editing .map-el { cursor: grab; touch-action: none; }
.map-wrap.editing .map-el.selected { cursor: move; }

.map-el.selected {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    z-index: 5;
}
.map-el.hit {
    outline: 3px solid #ff3b30;
    outline-offset: 2px;
    z-index: 4;
    animation: map-pulse 1.1s ease-in-out infinite;
}
@keyframes map-pulse {
    50% { outline-color: rgba(255, 59, 48, 0.25); }
}

.map-el.t-gondola {
    border-width: 3px;
    background-image: repeating-linear-gradient(45deg,
        rgba(224, 27, 27, 0.14) 0 5px, transparent 5px 10px);
}
.map-el.t-popisek {
    border-style: dashed;
    border-color: transparent;
    background: none !important;
    font-size: 1.15em;
    font-weight: 700;
    overflow: visible;
    white-space: nowrap;
}
.map-wrap.editing .map-el.t-popisek { border-color: var(--border); }
.map-el.t-popisek .map-label {
    overflow: visible;
    max-width: none;
    max-height: none;
    background: var(--bg-card);
    box-shadow: 0 0 0 1px var(--border);
    border-radius: 4px;
    padding: 0 3px;
}

.map-label {
    display: inline-block;
    max-width: 100%;
    max-height: 100%;
    overflow: hidden;
    padding: 0 1px;
}
.map-label.vertical { writing-mode: vertical-rl; }

.map-count {
    display: inline-block;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    border-radius: 999px;
    padding: 0 0.35em;
    margin-left: 0.25em;
    font-size: 0.85em;
    font-weight: 700;
}

.map-handle {
    position: absolute;
    right: -7px;
    bottom: -7px;
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: var(--accent);
    border: 2px solid #fff;
    cursor: nwse-resize;
    touch-action: none;
}

@media print {
    .map-wrap { max-height: none; overflow: visible; border: none; }
}

/* --- Fotky a detail prvku --------------------------------------------------- */

.photo-field { display: flex; gap: 0.7rem; align-items: center; }
.photo-buttons { display: flex; flex-direction: column; gap: 0.4rem; }

.photo-preview {
    width: 96px;
    height: 96px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--bg-soft);
}
.photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.photo-preview.empty span { font-size: 0.78rem; color: var(--text-secondary); }

.article-thumb {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    object-fit: cover;
    background: var(--bg-soft);
    display: grid;
    place-items: center;
    cursor: pointer;
}
.article-thumb.empty { font-size: 1.1rem; cursor: default; }

.detail-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

.detail-photo {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 0.7rem;
    cursor: pointer;
    border: 1px solid var(--border);
}

.photo-full {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 10px;
    background: var(--bg-soft);
}

/* --- Stav ukládání v online verzi ------------------------------------------- */

.cloud-chip {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-secondary);
    white-space: nowrap;
}
.cloud-chip.ok { background: var(--success-soft); color: var(--success); border-color: var(--success); }
.cloud-chip.saving { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.cloud-chip.error { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

/* --- Pohled na regál -------------------------------------------------------- */

.shelf-controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    font-size: 0.9rem;
    font-weight: 600;
}
.shelf-controls .btn-secondary { padding: 0.3rem 0.8rem; font-size: 1rem; line-height: 1; }
.shelf-count { font-size: 1.2rem; min-width: 1.4rem; text-align: center; }
.shelf-controls .muted { font-weight: 400; }

.shelf-unit {
    border: 4px solid var(--shelf-frame);
    border-radius: 8px;
    background: var(--shelf-back);
    overflow: hidden;
    margin-bottom: 0.9rem;
    box-shadow: var(--shadow);
}

.shelf-level {
    border-bottom: 7px solid var(--shelf-board);
    padding: 1.5rem 0.6rem 0.5rem;
    position: relative;
    min-height: 96px;
    display: flex;
    align-items: flex-end;
}
.shelf-level:last-child { border-bottom: none; }

/* --- Pomocné funkce ------------------------------------------------------- */

function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function isoDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function parseISO(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
}

function todayISO() {
    return isoDate(new Date());
}

function addDays(iso, count) {
    const date = parseISO(iso);
    date.setDate(date.getDate() + count);
    return isoDate(date);
}

/* Pondělí týdne, do kterého datum spadá. */
function weekStart(iso) {
    const date = parseISO(iso);
    const shift = (date.getDay() + 6) % 7;
    date.setDate(date.getDate() - shift);
    return isoDate(date);
}

const DAY_NAMES = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
const DAY_SHORT = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
const MONTH_NAMES = ['ledna', 'února', 'března', 'dubna', 'května', 'června',
    'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

function dayName(iso) {
    return DAY_NAMES[parseISO(iso).getDay()];
}

function dayShort(iso) {
    return DAY_SHORT[parseISO(iso).getDay()];
}

function isWeekend(iso) {
    const d = parseISO(iso).getDay();
    return d === 0 || d === 6;
}

function formatDate(iso) {
    const date = parseISO(iso);
    return `${date.getDate()}. ${date.getMonth() + 1}.`;
}

function formatDateLong(iso) {
    const date = parseISO(iso);
    return `${dayName(iso)} ${date.getDate()}. ${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
}

/* '06:15' -> 375 minut */
function timeToMinutes(time) {
    if (!time || !/^\d{1,2}:\d{2}$/.test(time)) return null;
    const [h, m] = time.split(':').map(Number);
    return h * 60 + m;
}

function minutesToText(minutes) {
    if (minutes == null) return '–';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return m ? `${h}:${String(m).padStart(2, '0')} h` : `${h} h`;
}

/* Délka směny v minutách. Přes půlnoc se počítá jako pokračování dalšího dne. */
function shiftMinutes(from, to) {
    const start = timeToMinutes(from);
    const end = timeToMinutes(to);
    if (start == null || end == null) return 0;
    return end >= start ? end - start : (24 * 60 - start) + end;
}

/* Čistý odpracovaný čas po odečtení zákonné přestávky. */
function netMinutes(from, to) {
    const gross = shiftMinutes(from, to);
    const rules = DB.settings.break;
    if (!rules || !rules.minutes) return gross;
    if (gross >= rules.afterHours * 60) return gross - rules.minutes;
    return gross;
}

/* --- Výchozí databáze ----------------------------------------------------- */

function emptyDb() {
    return {
        version: SCHEMA_VERSION,
        settings: {
            storeName: '',
            myName: '',
            openFrom: '07:00',
            openTo: '21:00',
            morningShift: { from: '06:00', to: '14:00' },
            afternoonShift: { from: '13:00', to: '21:30' },
            break: { afterHours: 6, minutes: 30 },
            theme: ''
        },
        employees: [],
        tasks: DEFAULT_TASKS.map(t => ({ ...t })),
        deliveryTypes: DEFAULT_DELIVERY_TYPES.map(t => ({ ...t })),
        checklists: {
            open: DEFAULT_CHECKLISTS.open.map(text => ({ id: uid(), text })),
            during: DEFAULT_CHECKLISTS.during.map(text => ({ id: uid(), text })),
            close: DEFAULT_CHECKLISTS.close.map(text => ({ id: uid(), text }))
        },
        days: {},
        notes: [],
        map: defaultMap()
    };
}

/* Doplní chybějící klíče – aby appka přežila starší zálohu i ruční úpravu. */
function normalize(data) {
    const base = emptyDb();
    if (!data || typeof data !== 'object') return base;

    const db = {
        version: SCHEMA_VERSION,
        settings: { ...base.settings, ...(data.settings || {}) },
        employees: Array.isArray(data.employees) ? data.employees : [],
        tasks: Array.isArray(data.tasks) && data.tasks.length ? data.tasks : base.tasks,
        deliveryTypes: Array.isArray(data.deliveryTypes) && data.deliveryTypes.length
            ? data.deliveryTypes : base.deliveryTypes,
        checklists: { ...base.checklists, ...(data.checklists || {}) },
        days: (data.days && typeof data.days === 'object') ? data.days : {},
        notes: Array.isArray(data.notes) ? data.notes : [],
        map: (data.map && Array.isArray(data.map.elements)) ? data.map : defaultMap()
    };

    db.settings.break = { ...base.settings.break, ...(db.settings.break || {}) };
    db.settings.morningShift = { ...base.settings.morningShift, ...(db.settings.morningShift || {}) };
    db.settings.afternoonShift = { ...base.settings.afternoonShift, ...(db.settings.afternoonShift || {}) };

    db.employees.forEach(e => {
        e.id = e.id || uid();
        e.skills = Array.isArray(e.skills) ? e.skills : [];
        e.active = e.active !== false;
    });

    Object.entries(db.days).forEach(([iso, day]) => {
        db.days[iso] = { ...emptyDay(iso), ...day };
        const d = db.days[iso];
        d.entries = Array.isArray(d.entries) ? d.entries : [];
        d.deliveries = Array.isArray(d.deliveries) ? d.deliveries : [];
        d.checks = d.checks && typeof d.checks === 'object' ? d.checks : {};
        d.entries.forEach(entry => {
            entry.id = entry.id || uid();
            entry.tasks = Array.isArray(entry.tasks) ? entry.tasks : [];
        });
        d.deliveries.forEach(item => {
            item.id = item.id || uid();
            item.pallets = Number(item.pallets) || 0;
            item.rolls = Number(item.rolls) || 0;
        });
    });

    db.notes.forEach(n => {
        n.id = n.id || uid();
        n.tags = Array.isArray(n.tags) ? n.tags : [];
        n.date = n.date || todayISO();
    });

    /* Starší, ručně obkreslený plán nahradíme srovnaným – ale jen dokud si do něj
       nikdo nezapsal artikly. Kdo už v plánu pracuje, o svou verzi nepřijde. */
    const untouched = db.map.elements.every(element => !(element.articles || []).length);
    if ((Number(db.map.seed) || 1) < MAP_SEED && untouched) db.map = defaultMap();

    db.map.seed = Number(db.map.seed) || MAP_SEED;
    db.map.width = Number(db.map.width) || 1100;
    db.map.height = Number(db.map.height) || 1180;
    db.map.elements.forEach(element => {
        element.id = element.id || uid();
        element.type = element.type || 'ostatni';
        element.name = element.name || '';
        element.note = element.note || '';
        element.articles = Array.isArray(element.articles) ? element.articles : [];
        if (element.levels != null) {
            element.levels = Math.min(12, Math.max(1, Math.round(Number(element.levels) || 1)));
        }
        element.articles.forEach(article => {
            article.id = article.id || uid();
            article.name = article.name || '';
            ['code', 'ean', 'shelf', 'note'].forEach(key => { article[key] = article[key] || ''; });
            article.level = Math.max(0, Math.round(Number(article.level) || 0));
            if (article.level > levelsOf(element)) article.level = 0;
        });
        ['x', 'y', 'w', 'h'].forEach(key => { element[key] = Math.round(Number(element[key]) || 0); });
    });

    return db;
}

function emptyDay(iso) {
    return {
        date: iso,
        leaderId: '',
        leaderPmId: '',
        note: '',
        entries: [],
        deliveries: [],
        checks: {},
        stats: { revenue: '', customers: '', writeOff: '' }
    };
}

/* --- Načtení a uložení ---------------------------------------------------- */

let DB = load();

function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return normalize(raw ? JSON.parse(raw) : null);
    } catch {
        return emptyDb();
    }
}

function save() {
    /* Online verze ukládá do účtu, offline do paměti prohlížeče. */
    if (window.CLOUD && window.CLOUD.enabled) return window.CLOUD.save();
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        return true;
    } catch (err) {
        alert('Data se nepodařilo uložit – paměť prohlížeče je plná (nejspíš kvůli fotkám). Stáhni si zálohu v Nastavení a část fotek smaž.');
        return false;
    }
}

function replaceDb(data) {
    DB = normalize(data);
    save();
}

/* --- Přístup k datům ------------------------------------------------------ */

function getDay(iso) {
    return DB.days[iso] || emptyDay(iso);
}

/* Vrátí den připravený k zápisu (a rovnou ho zaregistruje v databázi). */
function ensureDay(iso) {
    if (!DB.days[iso]) DB.days[iso] = emptyDay(iso);
    return DB.days[iso];
}

function hasDayContent(day) {
    return Boolean(
        day.entries.length ||
        day.deliveries.length ||
        day.note ||
        day.leaderId ||
        day.leaderPmId ||
        Object.values(day.checks).some(Boolean) ||
        (day.stats && (day.stats.revenue || day.stats.customers || day.stats.writeOff))
    );
}

/* Zahodí den, ve kterém po úpravě nic nezůstalo. */
function pruneDay(iso) {
    const day = DB.days[iso];
    if (day && !hasDayContent(day)) delete DB.days[iso];
}

function employeeById(id) {
    return DB.employees.find(e => e.id === id) || null;
}

function employeeName(id) {
    const employee = employeeById(id);
    return employee ? employee.name : 'Neurčeno';
}

function taskById(id) {
    return DB.tasks.find(t => t.id === id) || { id, name: id, icon: '•' };
}

function deliveryTypeById(id) {
    return DB.deliveryTypes.find(t => t.id === id) || { id, name: id, icon: '📦' };
}

function activeEmployees() {
    return DB.employees.filter(e => e.active).sort((a, b) => a.name.localeCompare(b.name, 'cs'));
}

function weekDays(startIso) {
    return Array.from({ length: 7 }, (_, i) => addDays(startIso, i));
}

function palletsOfDay(iso) {
    return getDay(iso).deliveries.reduce((sum, item) => sum + (Number(item.pallets) || 0), 0);
}

function rollsOfDay(iso) {
    return getDay(iso).deliveries.reduce((sum, item) => sum + (Number(item.rolls) || 0), 0);
}

/* Odpracované minuty zaměstnance v zadaném rozsahu dní (včetně obou konců). */
function workedMinutes(employeeId, fromIso, toIso) {
    let total = 0;
    Object.keys(DB.days).forEach(iso => {
        if (iso < fromIso || iso > toIso) return;
        getDay(iso).entries
            .filter(entry => entry.employeeId === employeeId)
            .forEach(entry => { total += netMinutes(entry.from, entry.to); });
    });
    return total;
}

/* Skloňování počtů – ať appka nemluví jako formulář. */
function peopleText(count) {
    if (count === 1) return '1 člověk';
    if (count >= 2 && count <= 4) return `${count} lidi`;
    return `${count} lidí`;
}

function articleText(count) {
    if (count === 1) return '1 artikl';
    if (count >= 2 && count <= 4) return `${count} artikly`;
    return `${count} artiklů`;
}

function dayCountText(count) {
    if (count === 1) return '1 den';
    if (count >= 2 && count <= 4) return `${count} dny`;
    return `${count} dní`;
}

function checklistProgress(iso) {
    const day = getDay(iso);
    const all = [...DB.checklists.open, ...DB.checklists.during, ...DB.checklists.close];
    const done = all.filter(item => day.checks[item.id]).length;
    return { done, total: all.length };
}

/* Počet polic – buď vlastní u prvku, nebo výchozí podle typu. */
function levelsOf(element) {
    if (element.levels) return element.levels;
    return mapTypeById(element.type).levels || 1;
}

/* Artikly na jedné polici v pořadí, v jakém stojí zleva doprava.
   Police 0 znamená „zatím nezařazeno". */
function articlesOnLevel(element, level) {
    return element.articles.filter(article => (article.level || 0) === level);
}

function levelName(level, total) {
    if (!level) return 'Nezařazené';
    if (level === 1) return total > 1 ? '1. police (nahoře)' : '1. police';
    if (level === total) return `${level}. police (dole)`;
    return `${level}. police`;
}

function mapElementById(id) {
    return DB.map.elements.find(e => e.id === id) || null;
}

/* Vyhledá artikl napříč celým plánem – podle názvu, čísla, EAN i poznámky. */
function findArticles(query) {
    const text = query.trim().toLowerCase();
    if (!text) return [];
    const hits = [];
    DB.map.elements.forEach(element => {
        element.articles.forEach(article => {
            const haystack = [article.name, article.code, article.ean, article.shelf, article.note]
                .filter(Boolean).join(' ').toLowerCase();
            if (haystack.includes(text)) hits.push({ element, article });
        });
    });
    return hits.sort((a, b) => a.article.name.localeCompare(b.article.name, 'cs'));
}

function allArticles() {
    const rows = [];
    DB.map.elements.forEach(element =>
        element.articles.forEach(article => rows.push({ element, article })));
    return rows.sort((a, b) => a.article.name.localeCompare(b.article.name, 'cs'));
}

function articleCount() {
    return DB.map.elements.reduce((sum, element) => sum + element.articles.length, 0);
}

function photoCount() {
    return DB.map.elements.reduce((sum, element) =>
        sum + element.articles.filter(article => article.photo || article.photoId).length, 0);
}

/* Kolik místa data zabírají – fotky se do prohlížeče vejdou jen v omezeném počtu. */
function storageBytes() {
    try {
        return new Blob([JSON.stringify(DB)]).size;
    } catch {
        return JSON.stringify(DB).length;
    }
}

function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} kB`;
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

    <script>
/* ==========================================================================

let mapShowList = false;
const mapUndo = [];
let mapScroll = { left: 0, top: 0 };
let mapCurrentZoom = 1;

const SNAP = 5;

function pushMapUndo() {
    mapUndo.push(JSON.stringify(DB.map));

}

function undoMap() {

}

function effectiveZoom(available) {
    if (mapZoom) return mapZoom;

}

function elementLabelHtml(element, zoom) {
    const count = element.articles.length;

    if (element.type !== 'popisek' && zoom < 0.45) {
        return badge || camera ? `<span class="map-label tiny">${badge}${camera}</span>` : '';
    }

    const type = mapTypeById(element.type);

    const vertical = element.h > element.w * 1.8 && element.h * zoom > 55;
    const icon = roomy && type.icon ? `<span class="map-icon">${type.icon}</span>` : '';

    return `<span class="map-label ${vertical ? 'vertical' : ''}">

}

function mapElementHtml(element, zoom, hits) {

}

function propsPanelHtml() {

                    ${MAP_TYPES.map(t => `<option value="${t.id}" ${t.id === element.type ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
                </select>

                <button class="btn-danger" data-map-action="delete-el">🗑️ Smazat prvek</button>
            </div>` : `
            ${element.note ? `<div class="muted" style="margin-bottom:0.6rem;">📝 ${esc(element.note)}</div>` : ''}`}

}

/* Fotka je buď rovnou v datech, nebo uložená zvlášť v účtu a dotáhne se později. */
function photoOf(item) {
    if (item.photo) return item.photo;
    if (item.photoId && window.CLOUD) return window.CLOUD.cachedPhoto(item.photoId);
    return null;
}

function hasPhoto(item) {
    return Boolean(item.photo || item.photoId);
}

/* Přepíše online vrstva – dotáhne fotky, které ještě nejsou stažené. */
function hydratePhotos() {}

function articleThumbHtml(article, elementId) {
    if (!hasPhoto(article)) return '<span class="article-thumb empty">🛒</span>';
    const src = photoOf(article);
    return `<img class="article-thumb" ${src ? `src="${esc(src)}"` : 'data-photo-pending'}
                 data-photo-id="${esc(article.photoId || '')}" alt=""
                 data-map-action="photo" data-el-id="${elementId}" data-article="${article.id}">`;
}

function articleListHtml() {
    const rows = allArticles();

    return `

                <button class="btn-secondary" data-map-action="toggle-list">Skrýt</button>

                    <div class="row-main" data-map-action="goto" data-el-id="${element.id}" style="cursor:pointer;">
                        <div class="row-title">${esc(article.name)}</div>

                        <div class="row-sub">${article.ean ? `EAN ${esc(article.ean)}` : ''}${
                            article.code ? `${article.ean ? ' · ' : ''}č. ${esc(article.code)}` : ''}</div>
                    </div>
                    <div class="row-actions">
                        <button class="btn-ghost" data-map-action="edit-article-of"
                                data-el-id="${element.id}" data-article="${article.id}">✏️</button>
                    </div>
                </div>`).join('')
            : '<div class="empty">Zatím žádné artikly. Klikni na prvek v plánu a přidej, co v něm leží.</div>'}
        </div>`;
}

function renderMap() {
    const hitList = findArticles(mapSearch);
    const hits = new Set(hitList.map(hit => hit.element.id));
    const styles = getComputedStyle(view);
    const padding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
    const available = Math.max(260, (view.clientWidth || document.body.clientWidth) - padding - 4);
    const zoom = effectiveZoom(available);

    view.innerHTML = `
        <div class="view-head">
            <div>
                <h2>Plán prodejny</h2>
                <div class="subtitle">${DB.map.elements.length} prvků · ${articleText(articleCount())} ·
                    ${photoCount()} fotek · ${formatBytes(storageBytes())} ·
                    ${mapEdit ? 'režim úprav' : 'režim prohlížení – klikni na prvek'}</div>
            </div>
            <div class="btn-row no-print">
                <button class="${mapEdit ? 'btn' : 'btn-secondary'}" data-map-action="toggle-edit">
                    ${mapEdit ? '🔒 Přepnout na prohlížení' : '✏️ Přepnout na úpravy'}
                </button>
            </div>

        <div class="card no-print">
            <div class="search-bar" style="margin-bottom:0;">
                <input type="search" placeholder="Kde je artikl? Např. rýže…" value="${esc(mapSearch)}" data-map-search>
                <button class="btn-secondary" data-map-action="toggle-list">${mapShowList ? 'Skrýt seznam' : '📋 Seznam artiklů'}</button>
            </div>
            ${mapSearch ? (hitList.length ? `
                <div style="margin-top:0.7rem;">

                                <div class="row-title">${esc(article.name)}</div>
                                <div class="row-sub">📍 ${esc(element.name)}${article.shelf ? ` · ${esc(article.shelf)}` : ''}</div>
                                <div class="row-sub">${article.ean ? `EAN ${esc(article.ean)}` : ''}</div>
                            </div>
                            <button class="btn-ghost" data-map-action="detail-of" data-el-id="${element.id}">🔍</button>

                </div>`
                : '<div class="empty">Nic takového tu zapsané není.</div>') : ''}
        </div>

        ${mapEdit ? `
        <div class="map-toolbar no-print">
            <select data-map-add>

            </select>
            <button class="btn-secondary" data-map-action="zoom-out">−</button>

        <div class="map-wrap ${mapEdit ? 'editing' : ''}" id="map-wrap">

/* --- Interakce v plánu ------------------------------------------------------ */

function applyElementStyle(element) {
    const node = document.querySelector(`[data-el="${element.id}"]`);
    if (!node) return;
    node.style.left = `${element.x * mapCurrentZoom}px`;
    node.style.top = `${element.y * mapCurrentZoom}px`;
    node.style.width = `${element.w * mapCurrentZoom}px`;
    node.style.height = `${element.h * mapCurrentZoom}px`;
}

/* Výběr prvku překreslí jen panel – plán zůstane na místě, ať jde hned táhnout. */
function selectElement(id) {
    mapSelected = id;
    const canvas = document.getElementById('map-canvas');
    canvas.querySelectorAll('.map-el.selected').forEach(node => {
        node.classList.remove('selected');
        const handle = node.querySelector('[data-handle]');
        if (handle) handle.remove();
    });

    const node = id ? canvas.querySelector(`[data-el="${id}"]`) : null;
    if (node) {
        node.classList.add('selected');
        if (mapEdit && !node.querySelector('[data-handle]')) {
            const handle = document.createElement('span');
            handle.className = 'map-handle';
            handle.dataset.handle = '';
            node.appendChild(handle);
        }
    }
    refreshPanel();
}

function refreshPanel() {
    const holder = document.getElementById('map-props');
    if (!holder) return;
    holder.innerHTML = propsPanelHtml();
    attachPanelHandlers();
}

function attachPanelHandlers() {
    const holder = document.getElementById('map-props');
    if (!holder) return;

    holder.querySelectorAll('[data-prop]').forEach(input => {
        input.addEventListener('change', () => {
            const element = mapElementById(mapSelected);
            if (!element) return;
            pushMapUndo();
            const key = input.dataset.prop;
            element[key] = ['x', 'y', 'w', 'h'].includes(key)
                ? Math.max(0, Math.round(Number(input.value) || 0))
                : input.value.trim();
            save();
            if (key === 'type' || key === 'name') renderMap();
            else { applyElementStyle(element); refreshPanel(); }
        });
    });

    holder.querySelectorAll('[data-map-action]').forEach(node => {
        node.addEventListener('click', () => runMapAction(node.dataset.mapAction, node.dataset));
    });
}

function attachMapHandlers(zoom) {
    const canvas = document.getElementById('map-canvas');
    let drag = null;

    canvas.addEventListener('pointerdown', event => {
        const node = event.target.closest('.map-el');
        if (!node) {
            if (mapSelected) selectElement(null);
            return;
        }

        const element = mapElementById(node.dataset.el);
        if (!element) return;
        if (element.id !== mapSelected) selectElement(element.id);
        if (!mapEdit) { go(`#/regal/${element.id}`); return; }

        drag = {
            node,
            element,
            resizing: Boolean(event.target.closest('[data-handle]')),
            startX: event.clientX,
            startY: event.clientY,
            origin: { x: element.x, y: element.y, w: element.w, h: element.h },
            moved: false
        };
        node.setPointerCapture(event.pointerId);
        event.preventDefault();
    });

    canvas.addEventListener('pointermove', event => {
        if (!drag) return;
        const dx = (event.clientX - drag.startX) / zoom;
        const dy = (event.clientY - drag.startY) / zoom;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) drag.moved = true;

        const snap = value => Math.round(value / SNAP) * SNAP;
        if (drag.resizing) {
            drag.element.w = Math.max(10, snap(drag.origin.w + dx));
            drag.element.h = Math.max(10, snap(drag.origin.h + dy));
        } else {
            drag.element.x = Math.max(0, Math.min(DB.map.width - drag.element.w, snap(drag.origin.x + dx)));
            drag.element.y = Math.max(0, Math.min(DB.map.height - drag.element.h, snap(drag.origin.y + dy)));
        }
        applyElementStyle(drag.element);
    });

    const endDrag = () => {
        if (!drag) return;
        const { origin, element, moved } = drag;
        drag = null;
        if (!moved) return;
        /* Do historie patří stav před tažením. */
        const after = { x: element.x, y: element.y, w: element.w, h: element.h };
        Object.assign(element, origin);
        pushMapUndo();
        Object.assign(element, after);
        save();
        refreshPanel();
    };

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);

    canvas.addEventListener('dblclick', event => {
        const node = event.target.closest('.map-el');
        if (node) go(`#/regal/${node.dataset.el}`);
    });

    const search = view.querySelector('[data-map-search]');
    if (search) search.addEventListener('input', () => {
        const caret = search.selectionStart;
        mapSearch = search.value;
        renderMap();
        const next = view.querySelector('[data-map-search]');
        if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });

    const adder = view.querySelector('[data-map-add]');
    if (adder) adder.addEventListener('change', () => {
        if (adder.value) addMapElement(adder.value);
    });

    /* Tlačítka mimo panel; panel si posluchače připojuje sám, protože se
       překresluje i samostatně (výběr prvku, konec tažení). */
    view.querySelectorAll('[data-map-action]').forEach(node => {
        if (node.closest('#map-props')) return;
        node.addEventListener('click', () => runMapAction(node.dataset.mapAction, node.dataset));
    });
    attachPanelHandlers();
}

/* --- Akce plánu -------------------------------------------------------------- */

function addMapElement(type) {
    pushMapUndo();
    const element = {
        id: uid(),
        type,
        name: mapTypeById(type).name,
        x: Math.round(DB.map.width / 2 - 40),
        y: Math.round(DB.map.height / 2 - 30),
        w: 80,
        h: 60,
        note: '',
        articles: []
    };
    DB.map.elements.push(element);
    mapSelected = element.id;
    save();
    renderMap();
    toast('Prvek přidán doprostřed plánu');
}

function articleForm(elementId, articleId, afterSave, presetLevel) {
    const element = mapElementById(elementId);
    if (!element) return;
    const article = articleId ? element.articles.find(a => a.id === articleId) : null;
    const done = () => { if (afterSave) afterSave(); else renderMap(); };
    const total = levelsOf(element);
    const levelOptions = [{ value: 0, label: 'Nezařazeno' }].concat(
        Array.from({ length: total }, (_, i) => ({ value: i + 1, label: levelName(i + 1, total) })));

    openForm({
        title: article ? 'Upravit artikl' : `Nový artikl · ${element.name}`,
        fields: [
            { name: 'name', label: 'Název', type: 'text', required: true, placeholder: 'např. Rýže basmati 1 kg' },
            { name: 'ean', label: 'EAN', type: 'text', placeholder: '8594001234567',
              hint: 'Čárový kód ze zadní strany obalu.' },
            { type: 'row', fields: [
                { name: 'code', label: 'Číslo artiklu', type: 'text' },
                { name: 'level', label: 'Police', type: 'select', options: levelOptions }
            ] },
            { name: 'shelf', label: 'Upřesnění pozice', type: 'text', placeholder: 'např. vlevo u kraje' },
            { name: 'photo', label: 'Fotka artiklu', type: 'photo',
              hint: 'Fotka se zmenší a uloží do prohlížeče. Ať jich není víc než pár set.' },
            { name: 'note', label: 'Poznámka', type: 'text', placeholder: 'např. akce od čtvrtka, zásoba ve skladu' }
        ],
        values: article || { level: presetLevel || 0 },
        onSave: data => {
            if (!data.name) return;
            data.level = Number(data.level) || 0;
            pushMapUndo();
            if (data.photo) data.photoId = '';
            if (article) Object.assign(article, data);
            else element.articles.push({ id: uid(), ...data });
            if (!save()) { mapUndo.pop(); return; }
            done();
            toast(article ? 'Uloženo' : 'Artikl přidán');
        },
        onDelete: article ? () => {
            pushMapUndo();
            element.articles = element.articles.filter(a => a.id !== articleId);
            save();
            done();
            toast('Smazáno');
        } : null
    });
}

/* Fotka celého místa – regálu, gondoly, chladicího boxu. */
function elementPhotoForm(elementId, afterSave) {
    const element = mapElementById(elementId);
    if (!element) return;

    openForm({
        title: `Fotka místa · ${element.name}`,
        fields: [{ name: 'photo', label: 'Jak to tady vypadá', type: 'photo',
                   hint: 'Vyfoť regál nebo gondolu, ať víš, jak má být naskládaná.' }],
        values: { photo: element.photo || '' },
        onSave: data => {
            pushMapUndo();
            element.photo = data.photo;
            if (data.photo) element.photoId = '';
            if (!save()) { mapUndo.pop(); return; }
            if (afterSave) afterSave(); else renderMap();
            toast(data.photo ? 'Fotka uložena' : 'Fotka odebrána');
        }
    });
}

/* Fotka přes celou obrazovku; po zavření se vrátíme na regál. */
function openPhoto(elementId, articleId) {
    const element = mapElementById(elementId);
    if (!element) return;
    const article = articleId === 'element' ? null : element.articles.find(a => a.id === articleId);
    const target = article || element;
    if (!hasPhoto(target)) return;
    const photo = photoOf(target);

    openModal({
        title: article ? article.name : element.name,
        bodyHtml: photo
            ? `<img class="photo-full" src="${esc(photo)}" alt="">`
            : `<img class="photo-full" data-photo-pending data-photo-id="${esc(target.photoId)}" alt="">`,
        actionsHtml: '<button class="btn-secondary" data-photo-back>Zpět</button>',
        onMount: modal => {
            modal.querySelector('[data-photo-back]')
                .addEventListener('click', () => { closeModal(); go(`#/regal/${elementId}`); });
            hydratePhotos(modal);
        }
    });
}

function runMapAction(action, data) {
    const element = mapElementById(mapSelected);

    switch (action) {
        case 'toggle-edit':
            mapEdit = !mapEdit;
            renderMap();
            break;
        case 'zoom-in':
            mapZoom = Math.min(2, (mapZoom || effectiveZoom(view.clientWidth)) * 1.25);
            renderMap();
            break;
        case 'zoom-out':
            mapZoom = Math.max(0.15, (mapZoom || effectiveZoom(view.clientWidth)) / 1.25);
            renderMap();
            break;
        case 'zoom-fit':
            mapZoom = null;
            renderMap();
            break;
        case 'undo':
            undoMap();
            break;
        case 'print':
            window.print();
            break;
        case 'toggle-list':
            mapShowList = !mapShowList;
            renderMap();
            break;
        case 'goto':
            mapSelected = data.elId;
            renderMap();
            document.querySelector(`[data-el="${data.elId}"]`)
                ?.scrollIntoView({ block: 'center', inline: 'center' });
            break;
        case 'duplicate': {
            if (!element) return;
            pushMapUndo();
            const copy = {
                ...element,
                id: uid(),
                x: Math.min(DB.map.width - element.w, element.x + 15),
                y: Math.min(DB.map.height - element.h, element.y + 15),
                articles: element.articles.map(a => ({ ...a, id: uid() }))
            };
            DB.map.elements.push(copy);
            mapSelected = copy.id;
            save();
            renderMap();
            break;
        }
        case 'delete-el':
            if (!element) return;
            if (!confirm(`Smazat prvek „${element.name}“ i s artikly?`)) return;
            pushMapUndo();
            DB.map.elements = DB.map.elements.filter(e => e.id !== element.id);
            mapSelected = null;
            save();
            renderMap();
            break;
        case 'detail':
            if (element) go(`#/regal/${element.id}`);
            break;
        case 'element-photo':
            if (element) elementPhotoForm(element.id);
            break;
        case 'add-article':
            if (element) articleForm(element.id);
            break;
        case 'edit-article-of':
            articleForm(data.elId, data.article);
            break;
        case 'photo':
            openPhoto(data.elId, data.article);
            break;
        case 'detail-of':
            go(`#/regal/${data.elId}`);
            break;
        case 'reset-map':
            if (!confirm('Vrátit plán do výchozí podoby? Přijdeš o své úpravy i o zapsané artikly.')) return;
            pushMapUndo();
            DB.map = defaultMap();
            mapSelected = null;
            save();
            renderMap();
            toast('Plán vrácen na výchozí');
            break;
    }
}

/* Posun vybraného prvku šipkami. */
document.addEventListener('keydown', event => {
    if (currentRoute().name !== 'mapa' || !mapEdit || !mapSelected) return;
    if (!event.key.startsWith('Arrow')) return;
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

    const element = mapElementById(mapSelected);
    if (!element) return;
    const step = event.shiftKey ? 20 : SNAP;
    pushMapUndo();
    if (event.key === 'ArrowLeft') element.x = Math.max(0, element.x - step);
    if (event.key === 'ArrowRight') element.x = Math.min(DB.map.width - element.w, element.x + step);
    if (event.key === 'ArrowUp') element.y = Math.max(0, element.y - step);
    if (event.key === 'ArrowDown') element.y = Math.min(DB.map.height - element.h, element.y + step);
    save();
    applyElementStyle(element);
    refreshPanel();
    event.preventDefault();
});

    <script>
/* ==========================================================================
   Pohled na regál – čelní 2D pohled na jedno místo v prodejně.
   Police se přidávají a ubírají, artikly se mezi nimi přetahují prstem i myší.
   ========================================================================== */

let shelfDrag = null;

function shelfGoodsHtml(element, article) {
    const src = photoOf(article);
    const photo = hasPhoto(article)
        ? `<img ${src ? `src="${esc(src)}"` : 'data-photo-pending'}
                data-photo-id="${esc(article.photoId || '')}" alt="">`
        : '';
    return `
        <div class="goods-item" data-article="${article.id}" title="${esc(article.name)}">
            ${photo}
            <span class="goods-name">${esc(article.name)}</span>
            ${article.ean ? `<span class="goods-ean">${esc(article.ean)}</span>` : ''}
        </div>`;
}

function shelfLevelHtml(element, level, total) {
    const goods = articlesOnLevel(element, level);
    return `
        <div class="shelf-level" data-level="${level}">
            <div class="shelf-tag">${esc(levelName(level, total))}
                <span class="shelf-tag-count">${goods.length}</span>
            </div>
            <div class="goods">
                ${goods.map(article => shelfGoodsHtml(element, article)).join('')}
                <button class="goods-add" data-shelf-action="add-here" data-level="${level}"
                        title="Přidat artikl na tuhle polici">＋</button>
            </div>
        </div>`;
}

function renderShelf(elementId) {
    const element = mapElementById(elementId);
    if (!element) { go('#/mapa'); return; }

    const type = mapTypeById(element.type);
    const total = levelsOf(element);
    const loose = articlesOnLevel(element, 0);
    const levels = Array.from({ length: total }, (_, i) => i + 1);

    view.innerHTML = `
        <div class="view-head">
            <div>
                <h2>${esc(element.name || type.name)}</h2>
                <div class="subtitle">
                    <span class="pill" style="background:${type.fill}; color:${type.text}; border-color:${type.stroke};">
                        ${type.icon} ${esc(type.name)}</span>
                    ${articleText(element.articles.length)} · ${total === 1 ? '1 police' : total <= 4 ? total + ' police' : total + ' polic'}
                </div>
            </div>
            <div class="btn-row no-print">
                <button class="btn-secondary" data-nav="mapa">← Zpět do plánu</button>
                <button class="btn" data-shelf-action="add">➕ Přidat artikl</button>
            </div>
        </div>

        ${element.note ? `<div class="card"><div class="muted">📝 ${esc(element.note)}</div></div>` : ''}

        <div class="card no-print">
            <div class="shelf-controls">
                <span>Počet polic</span>
                <button class="btn-secondary" data-shelf-action="fewer" ${total <= 1 ? 'disabled' : ''}>−</button>
                <strong class="shelf-count">${total}</strong>
                <button class="btn-secondary" data-shelf-action="more" ${total >= 12 ? 'disabled' : ''}>＋</button>
                <span class="muted">Artikly přetáhni na tu polici, kde ve skutečnosti stojí.</span>
            </div>
        </div>

        <div class="shelf-unit">
            ${levels.map(level => shelfLevelHtml(element, level, total)).join('')}
        </div>

        <div class="card">
            <h3>📥 Nezařazené (${loose.length})</h3>
            <div class="shelf-level tray" data-level="0">
                <div class="goods">
                    ${loose.map(article => shelfGoodsHtml(element, article)).join('')}
                    <button class="goods-add" data-shelf-action="add-here" data-level="0" title="Přidat artikl">＋</button>
                </div>
            </div>
            <div class="field-hint">Sem patří zboží, u kterého ještě nevíš polici. Odsud ho přetáhneš do regálu.</div>
        </div>

        ${hasPhoto(element) ? `
        <div class="card">
            <h3>📷 Jak to tady vypadá</h3>
            <img class="detail-photo" ${photoOf(element) ? `src="${esc(photoOf(element))}"` : 'data-photo-pending'}
                 data-photo-id="${esc(element.photoId || '')}" alt="" data-shelf-action="open-photo">
        </div>` : ''}

        <div class="card no-print">
            <div class="btn-row">
                <button class="btn-secondary" data-shelf-action="photo">
                    ${hasPhoto(element) ? '🖼️ Změnit fotku místa' : '📷 Vyfotit místo'}</button>
                <button class="btn-secondary" data-shelf-action="rename">✏️ Přejmenovat a upravit</button>
            </div>
        </div>`;

    attachShelfHandlers(element);
    hydratePhotos(view);
}

/* --- Přetahování zboží ------------------------------------------------------- */

function attachShelfHandlers(element) {
    view.querySelectorAll('[data-shelf-action]').forEach(node => {
        node.addEventListener('click', () => runShelfAction(node.dataset.shelfAction, element, node.dataset));
    });

    view.querySelectorAll('.goods-item').forEach(item => {
        item.addEventListener('pointerdown', event => startGoodsDrag(event, element, item));
    });
}

/* Tažení sledujeme na celém dokumentu – jednou, ne při každém překreslení. */
document.addEventListener('pointermove', moveGoodsDrag);
document.addEventListener('pointerup', endGoodsDrag);
document.addEventListener('pointercancel', endGoodsDrag);

function startGoodsDrag(event, element, item) {
    const ghost = item.cloneNode(true);
    ghost.classList.add('goods-ghost');
    ghost.style.width = `${item.offsetWidth}px`;
    document.body.appendChild(ghost);

    shelfDrag = {
        element,
        articleId: item.dataset.article,
        item,
        ghost,
        moved: false,
        startX: event.clientX,
        startY: event.clientY
    };
    positionGhost(event);
    item.setPointerCapture?.(event.pointerId);
    event.preventDefault();
}

function positionGhost(event) {
    if (!shelfDrag) return;
    shelfDrag.ghost.style.left = `${event.clientX}px`;
    shelfDrag.ghost.style.top = `${event.clientY}px`;
}

function moveGoodsDrag(event) {
    if (!shelfDrag) return;
    if (Math.abs(event.clientX - shelfDrag.startX) > 4 || Math.abs(event.clientY - shelfDrag.startY) > 4) {
        shelfDrag.moved = true;
        shelfDrag.item.classList.add('dragging');
        shelfDrag.ghost.style.display = 'flex';
    }
    positionGhost(event);

    document.querySelectorAll('.shelf-level.over').forEach(node => node.classList.remove('over'));
    const target = levelUnderPointer(event);
    if (target) target.node.classList.add('over');
}

/* Police pod prstem a artikl, před který se zboží zařadí. */
function levelUnderPointer(event) {
    shelfDrag.ghost.style.visibility = 'hidden';
    const under = document.elementFromPoint(event.clientX, event.clientY);
    shelfDrag.ghost.style.visibility = '';
    const node = under && under.closest('.shelf-level');
    if (!node) return null;

    let before = null;
    node.querySelectorAll('.goods-item').forEach(item => {
        if (item.dataset.article === shelfDrag.articleId || before) return;
        const box = item.getBoundingClientRect();
        if (event.clientX < box.left + box.width / 2 && event.clientY < box.bottom) before = item.dataset.article;
    });
    return { node, level: Number(node.dataset.level), before };
}

function endGoodsDrag(event) {
    if (!shelfDrag) return;
    const drag = shelfDrag;
    const target = drag.moved ? levelUnderPointer(event) : null;

    drag.ghost.remove();
    drag.item.classList.remove('dragging');
    document.querySelectorAll('.shelf-level.over').forEach(node => node.classList.remove('over'));
    shelfDrag = null;

    if (!drag.moved) {
        articleForm(drag.element.id, drag.articleId, () => renderShelf(drag.element.id));
        return;
    }
    if (!target) return;

    pushMapUndo();
    moveArticleTo(drag.element, drag.articleId, target.level, target.before);
    save();
    renderShelf(drag.element.id);
}

/* Přesune artikl na police a zařadí ho na správné místo v pořadí. */
function moveArticleTo(element, articleId, level, beforeId) {
    const index = element.articles.findIndex(a => a.id === articleId);
    if (index < 0) return;
    const [article] = element.articles.splice(index, 1);
    article.level = level;

    if (beforeId) {
        const at = element.articles.findIndex(a => a.id === beforeId);
        if (at >= 0) { element.articles.splice(at, 0, article); return; }
    }
    const sameLevel = element.articles.filter(a => (a.level || 0) === level);
    const last = sameLevel[sameLevel.length - 1];
    if (last) element.articles.splice(element.articles.indexOf(last) + 1, 0, article);
    else element.articles.push(article);
}

/* --- Akce -------------------------------------------------------------------- */

function runShelfAction(action, element, data) {
    const back = () => renderShelf(element.id);

    switch (action) {
        case 'more':
            pushMapUndo();
            element.levels = levelsOf(element) + 1;
            save();
            back();
            break;
        case 'fewer': {
            const total = levelsOf(element);
            if (total <= 1) return;
            const orphans = articlesOnLevel(element, total);
            if (orphans.length && !confirm(
                `Na poslední polici je ${articleText(orphans.length)}. Přesunou se mezi nezařazené. Pokračovat?`)) return;
            pushMapUndo();
            orphans.forEach(article => { article.level = 0; });
            element.levels = total - 1;
            save();
            back();
            break;
        }
        case 'add':
            articleForm(element.id, null, back, 0);
            break;
        case 'add-here':
            articleForm(element.id, null, back, Number(data.level));
            break;
        case 'photo':
            elementPhotoForm(element.id, back);
            break;
        case 'rename':
            go(`#/mapa`);
            mapSelected = element.id;
            break;
        case 'open-photo':
            openPhoto(element.id, 'element');
            break;
    }
}

    <script>
/* ==========================================================================
   Vedení směny – aplikační logika
   Pohledy se vykreslují do #view, akce se řeší delegací přes data-action.
   ========================================================================== */

const NAV = [
    { id: 'prehled',   label: '📊 Přehled' },
    { id: 'plan',      label: '📅 Plán' },
    { id: 'mapa',      label: '🗺️ Prodejna' },
    { id: 'tym',       label: '👥 Tým' },
    { id: 'zbozi',     label: '📦 Zboží' },
    { id: 'checklist', label: '✅ Checklist' },
    { id: 'poznamky',  label: '📝 Poznámky' },
    { id: 'nastaveni', label: '⚙️ Nastavení' }
];

const view = document.getElementById('view');
const modalRoot = document.getElementById('modal-root');

let planWeek = weekStart(todayISO());
let noteFilter = { text: '', category: '', tag: '' };
let goodsRange = 'week';

/* --- Drobné pomůcky ------------------------------------------------------- */

function esc(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(message) {
    const box = document.createElement('div');
    box.className = 'toast';
    box.textContent = message;
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2200);
}

function persist(message) {
    if (save() && message) toast(message);
    render();
}

function go(hash) {
    location.hash = hash;
}

/* Fotku před uložením zmenšíme – do prohlížeče se vejde jen pár megabajtů. */
function compressImage(file, maxSide = 900, quality = 0.72) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Soubor se nepodařilo načíst.'));
        reader.onload = () => {
            const image = new Image();
            image.onerror = () => reject(new Error('Tohle není obrázek.'));
            image.onload = () => {
                const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(image.width * scale);
                canvas.height = Math.round(image.height * scale);
                canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            image.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

/* --- Modální okno --------------------------------------------------------- */

function closeModal() {
    modalRoot.innerHTML = '';
}

function openModal({ title, bodyHtml, actionsHtml, onMount }) {
    modalRoot.innerHTML = `
        <div class="modal-backdrop" data-close-backdrop>
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h3>${esc(title)}</h3>
                    <button class="btn-ghost" data-close-modal aria-label="Zavřít">✕</button>
                </div>
                <div class="modal-body">${bodyHtml}</div>
                ${actionsHtml ? `<div class="modal-actions">${actionsHtml}</div>` : ''}
            </div>
        </div>`;

    modalRoot.querySelector('[data-close-modal]').addEventListener('click', closeModal);
    modalRoot.querySelector('[data-close-backdrop]').addEventListener('click', event => {
        if (event.target.hasAttribute('data-close-backdrop')) closeModal();
    });
    if (onMount) onMount(modalRoot.querySelector('.modal'));
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeModal();
});

/* --- Generátor formulářů --------------------------------------------------
   Pole: {name, label, type, options, hint, required, placeholder}
   Typy: text | number | time | date | textarea | select | checkbox | chips | row
   -------------------------------------------------------------------------- */

function fieldHtml(field, values) {
    const value = values[field.name];

    if (field.type === 'row') {
        return `<div class="field-row">${field.fields.map(f => fieldHtml(f, values)).join('')}</div>`;
    }

    if (field.type === 'checkbox') {
        return `
            <div class="field check-item">
                <input type="checkbox" id="f-${field.name}" name="${field.name}" ${value ? 'checked' : ''}>
                <label for="f-${field.name}">${esc(field.label)}</label>
            </div>`;
    }

    if (field.type === 'chips') {
        const selected = Array.isArray(value) ? value : [];
        const chips = field.options.map(opt => `
            <button type="button" class="chip ${selected.includes(opt.value) ? 'on' : ''}"
                    data-chip="${field.name}" data-value="${esc(opt.value)}">${esc(opt.label)}</button>`).join('');
        return `
            <div class="field">
                <label>${esc(field.label)}</label>
                <div class="chips" data-chips="${field.name}">${chips}</div>
                <input type="hidden" name="${field.name}" value="${esc(selected.join(','))}">
                ${field.hint ? `<div class="field-hint">${esc(field.hint)}</div>` : ''}
            </div>`;
    }

    if (field.type === 'photo') {
        return `
            <div class="field">
                <label>${esc(field.label)}</label>
                <div class="photo-field">
                    <div class="photo-preview ${value ? '' : 'empty'}" data-photo-preview="${field.name}">
                        ${value ? `<img src="${esc(value)}" alt="">` : '<span>bez fotky</span>'}
                    </div>
                    <div class="photo-buttons">
                        <label class="btn-secondary" style="cursor:pointer;">
                            📷 Vyfotit / vybrat
                            <input type="file" accept="image/*" data-photo-input="${field.name}" hidden>
                        </label>
                        <button type="button" class="btn-ghost" data-photo-clear="${field.name}">Odebrat</button>
                    </div>
                </div>
                <input type="hidden" name="${field.name}" value="${esc(value || '')}">
                ${field.hint ? `<div class="field-hint">${esc(field.hint)}</div>` : ''}
            </div>`;
    }

    let control;
    if (field.type === 'select') {
        const options = field.options.map(opt =>
            `<option value="${esc(opt.value)}" ${String(value ?? '') === String(opt.value) ? 'selected' : ''}>${esc(opt.label)}</option>`
        ).join('');
        control = `<select name="${field.name}" ${field.required ? 'required' : ''}>${options}</select>`;
    } else if (field.type === 'textarea') {
        control = `<textarea name="${field.name}" placeholder="${esc(field.placeholder || '')}">${esc(value || '')}</textarea>`;
    } else {
        const extra = field.type === 'number' ? `min="${field.min ?? 0}" step="${field.step ?? 1}"` : '';
        control = `<input type="${field.type}" name="${field.name}" value="${esc(value ?? '')}"
                          placeholder="${esc(field.placeholder || '')}" ${extra} ${field.required ? 'required' : ''}>`;
    }

    return `
        <div class="field">
            <label>${esc(field.label)}</label>
            ${control}
            ${field.hint ? `<div class="field-hint">${esc(field.hint)}</div>` : ''}
        </div>`;
}

function readForm(form, fields) {
    const result = {};
    const walk = list => list.forEach(field => {
        if (field.type === 'row') return walk(field.fields);
        const input = form.querySelector(`[name="${field.name}"]`);
        if (!input) return;
        if (field.type === 'checkbox') result[field.name] = input.checked;
        else if (field.type === 'chips') result[field.name] = input.value ? input.value.split(',') : [];
        else if (field.type === 'number') result[field.name] = input.value === '' ? '' : Number(input.value);
        else result[field.name] = input.value.trim();
    });
    walk(fields);
    return result;
}

function openForm({ title, fields, values = {}, submitLabel = 'Uložit', onSave, onDelete, deleteLabel = 'Smazat' }) {
    openModal({
        title,
        bodyHtml: `<form id="modal-form">${fields.map(f => fieldHtml(f, values)).join('')}</form>`,
        actionsHtml: `
            ${onDelete ? `<button type="button" class="btn-danger" data-form-delete>${esc(deleteLabel)}</button>` : ''}
            <button type="button" class="btn-secondary" data-close-modal-2>Zrušit</button>
            <button type="submit" form="modal-form" class="btn">${esc(submitLabel)}</button>`,
        onMount: modal => {
            const form = modal.querySelector('#modal-form');

            modal.querySelectorAll('[data-chip]').forEach(chip => {
                chip.addEventListener('click', () => {
                    const holder = form.querySelector(`input[name="${chip.dataset.chip}"]`);
                    const current = holder.value ? holder.value.split(',') : [];
                    const index = current.indexOf(chip.dataset.value);
                    if (index >= 0) current.splice(index, 1);
                    else current.push(chip.dataset.value);
                    holder.value = current.join(',');
                    chip.classList.toggle('on');
                });
            });

            modal.querySelectorAll('[data-photo-input]').forEach(input => {
                input.addEventListener('change', async () => {
                    const file = input.files[0];
                    if (!file) return;
                    const name = input.dataset.photoInput;
                    const preview = modal.querySelector(`[data-photo-preview="${name}"]`);
                    preview.innerHTML = '<span>zpracovávám…</span>';
                    try {
                        const data = await compressImage(file);
                        form.querySelector(`input[name="${name}"]`).value = data;
                        preview.classList.remove('empty');
                        preview.innerHTML = `<img src="${data}" alt="">`;
                    } catch (err) {
                        preview.classList.add('empty');
                        preview.innerHTML = '<span>nepovedlo se</span>';
                        alert(err.message);
                    }
                    input.value = '';
                });
            });

            modal.querySelectorAll('[data-photo-clear]').forEach(button => {
                button.addEventListener('click', () => {
                    const name = button.dataset.photoClear;
                    form.querySelector(`input[name="${name}"]`).value = '';
                    const preview = modal.querySelector(`[data-photo-preview="${name}"]`);
                    preview.classList.add('empty');
                    preview.innerHTML = '<span>bez fotky</span>';
                });
            });

            modal.querySelector('[data-close-modal-2]').addEventListener('click', closeModal);
            const deleteBtn = modal.querySelector('[data-form-delete]');
            if (deleteBtn) deleteBtn.addEventListener('click', () => {
                if (confirm('Opravdu smazat? Tuhle akci nelze vrátit zpět.')) { closeModal(); onDelete(); }
            });

            form.addEventListener('submit', event => {
                event.preventDefault();
                const data = readForm(form, fields);
                closeModal();
                onSave(data);
            });
            const first = form.querySelector('input, select, textarea');
            if (first) first.focus();
        }
    });
}

function employeeOptions(includeEmpty = true) {
    const options = activeEmployees().map(e => ({ value: e.id, label: e.name }));
    return includeEmpty ? [{ value: '', label: '—' }, ...options] : options;
}

function taskChipOptions() {
    return DB.tasks.map(t => ({ value: t.id, label: `${t.icon} ${t.name}` }));
}

/* --- Vykreslení hlavičky a routeru ---------------------------------------- */

function currentRoute() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    return { name: parts[0] || 'prehled', param: parts[1] || '' };
}

function renderNav(active) {
    document.getElementById('main-nav').innerHTML = NAV.map(item =>
        `<button class="tab ${item.id === active ? 'active' : ''}" data-nav="${item.id}">${item.label}</button>`
    ).join('');
}

function renderHeader() {
    document.getElementById('app-sub').textContent =
        DB.settings.storeName ? DB.settings.storeName : 'Nastav si prodejnu v Nastavení';
}

function render() {
    const route = currentRoute();
    const active = route.name === 'den' ? 'plan' : route.name === 'regal' ? 'mapa' : route.name;
    renderNav(active);
    renderHeader();
    window.scrollTo({ top: 0 });

    switch (route.name) {
        case 'plan':      return renderPlan();
        case 'mapa':      return renderMap();
        case 'regal':     return renderShelf(route.param);
        case 'den':       return renderDayDetail(route.param || todayISO());
        case 'tym':       return renderTeam();
        case 'zbozi':     return renderGoods();
        case 'checklist': return renderChecklist();
        case 'poznamky':  return renderNotes();
        case 'nastaveni': return renderSettings();
        default:          return renderDashboard();
    }
}

function entrySummary(entry) {
    const tasks = entry.tasks.map(id => taskById(id).name).join(', ');
    return `${entry.from}–${entry.to} · ${minutesToText(netMinutes(entry.from, entry.to))}${tasks ? ' · ' + tasks : ''}`;
}

function sortedEntries(day) {
    return [...day.entries].sort((a, b) => (timeToMinutes(a.from) || 0) - (timeToMinutes(b.from) || 0));
}
