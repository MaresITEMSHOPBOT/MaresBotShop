<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" role="img" aria-label="Leták ZÍTRA – zadní strana"><title>ZÍTRA – leták A5, zadní strana</title><defs><style>.h{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800}.b{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400}.m{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:600}</style></defs><rect width="420" height="595" fill="#F7F4ED"/><text x="36" y="70" class="m" font-size="10" letter-spacing="3" fill="#6B7785">CO UDĚLÁME V PRVNÍM ROCE</text><text class="h" font-size="34" fill="#0B2545" letter-spacing="-1"><tspan x="36" y="118">Sedm kroků,</tspan><tspan x="36" y="156">které poznáte</tspan><tspan x="36" y="194">na sobě.</tspan></text><rect x="36" y="216" width="54" height="3" fill="#FFB020"/><rect x="36" y="251" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 258 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="262" class="b" font-size="13" fill="#15181C">Zrychlené řízení pro nájemní výstavbu — do 6 měsíců</text><rect x="36" y="285" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 292 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="296" class="b" font-size="13" fill="#15181C">Oddělení ceny elektřiny od ceny plynu</text><rect x="36" y="319" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 326 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="330" class="b" font-size="13" fill="#15181C">Registr zakázek nad 1 mil. Kč, otevřená data</text><rect x="36" y="353" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 360 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="364" class="b" font-size="13" fill="#15181C">Konec 300 duplicitních hlášení pro živnostníky</text><rect x="36" y="387" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 394 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="398" class="b" font-size="13" fill="#15181C">Jedno přihlášení ke všem úřadům (eID pro všechno)</text><rect x="36" y="421" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 428 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="432" class="b" font-size="13" fill="#15181C">Objednání k lékaři online, garantovaná lhůta</text><rect x="36" y="455" width="14" height="14" rx="4" fill="none" stroke="#12A594" stroke-width="2"/><path d="M39.5 462 l3.2 3.2 l6.3 -6.8" fill="none" stroke="#12A594" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="466" class="b" font-size="13" fill="#15181C">Výdajový strop: každý nový zákon s cenovkou</text><rect x="36" y="508" width="348" height="1" fill="#D9D3C6"/><g transform="translate(36,524) scale(0.32)"><rect width="128" height="128" rx="30" fill="#0B2545"/><path d="M64 83 A17 17 0 0 1 98 83 Z" fill="#FFB020"/><g fill="#F7F4ED"><rect x="24" y="28" width="80" height="14" rx="2"/><polygon points="80,42 104,42 48,86 24,86"/><rect x="24" y="86" width="80" height="14" rx="2"/></g></g><text x="84" y="546" class="h" font-size="18" fill="#0B2545">ZÍTRA</text><text x="84" y="562" class="b" font-size="10" fill="#6B7785">zitra.cz · info@zitra.cz · @hnutizitra</text><text x="384" y="546" text-anchor="end" class="b" font-size="8.5" fill="#6B7785">Fiktivní koncept. Zadavatel ani zpracovatel</text><text x="384" y="558" text-anchor="end" class="b" font-size="8.5" fill="#6B7785">nejsou reálný politický subjekt.</text></svg>
