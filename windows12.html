<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 12</title>
<link rel="stylesheet" href="windows12.css">
</head>
<body>

<div id="boot-screen" class="boot-screen">
    <div class="boot-logo">
        <div class="boot-logo-grid">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>
    <div class="boot-spinner"></div>
    <div class="boot-text">Spouštění Windows 12...</div>
</div>

<div id="lock-screen" class="lock-screen hidden">
    <div class="lock-time">
        <div class="lock-clock" id="lock-clock">--:--</div>
        <div class="lock-date" id="lock-date">—</div>
    </div>
    <div class="lock-hint">Klikni nebo stiskni klávesu pro pokračování</div>
</div>

<div id="login-screen" class="login-screen hidden">
    <div class="login-card">
        <div class="login-avatar">U</div>
        <div class="login-name">Uživatel</div>
        <input type="password" id="login-password" class="login-input" placeholder="Heslo (libovolné)" autocomplete="off">
        <button id="login-button" class="login-btn">Přihlásit</button>
        <div class="login-hint">Heslo není potřeba — stačí Enter</div>
    </div>
</div>

<div id="desktop" class="desktop hidden">

    <div class="desktop-icons" id="desktop-icons"></div>

    <div id="context-menu" class="context-menu hidden">
        <div class="ctx-item" data-action="refresh">
            <span class="ctx-ico">⟳</span><span>Obnovit</span>
        </div>
        <div class="ctx-item" data-action="new-folder">
            <span class="ctx-ico">📁</span><span>Nová složka</span>
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" data-action="theme">
            <span class="ctx-ico">🎨</span><span>Přepnout motiv</span>
        </div>
        <div class="ctx-item" data-action="wallpaper">
            <span class="ctx-ico">🖼️</span><span>Změnit pozadí</span>
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" data-action="about">
            <span class="ctx-ico">ⓘ</span><span>O systému</span>
        </div>
    </div>

    <div id="window-container"></div>

    <div id="start-menu" class="start-menu hidden">
        <div class="start-search">
            <span class="start-search-icon">🔍</span>
            <input type="text" id="start-search-input" placeholder="Hledat aplikace, soubory a nastavení">
        </div>
        <div class="start-section">
            <div class="start-section-title">Připnuté</div>
            <div class="start-pinned" id="start-pinned"></div>
        </div>
        <div class="start-section">
            <div class="start-section-title">Doporučené</div>
            <div class="start-recommended" id="start-recommended"></div>
        </div>
        <div class="start-footer">
            <div class="start-user">
                <div class="start-user-avatar">U</div>
                <span>Uživatel</span>
            </div>
            <button class="start-power" id="start-power" title="Vypnout">⏻</button>
        </div>
    </div>

    <div id="power-menu" class="power-menu hidden">
        <div class="power-item" data-power="sleep"><span>🌙</span> Režim spánku</div>
        <div class="power-item" data-power="restart"><span>🔄</span> Restartovat</div>
        <div class="power-item" data-power="shutdown"><span>⏻</span> Vypnout</div>
        <div class="power-item" data-power="lock"><span>🔒</span> Uzamknout</div>
    </div>

    <div id="action-center" class="action-center hidden">
        <div class="ac-tiles">
            <button class="ac-tile" data-toggle="wifi"><span>📶</span><span>Wi-Fi</span></button>
            <button class="ac-tile" data-toggle="bt"><span>🔵</span><span>Bluetooth</span></button>
            <button class="ac-tile" data-toggle="flight"><span>✈️</span><span>Letový režim</span></button>
            <button class="ac-tile" data-toggle="battery"><span>🔋</span><span>Úsporný režim</span></button>
            <button class="ac-tile" data-toggle="night"><span>🌙</span><span>Noční světlo</span></button>
            <button class="ac-tile" data-toggle="theme"><span>🎨</span><span>Motiv</span></button>
        </div>
        <div class="ac-slider">
            <span>🔆</span>
            <input type="range" id="ac-brightness" min="40" max="100" value="100">
        </div>
        <div class="ac-slider">
            <span>🔊</span>
            <input type="range" id="ac-volume" min="0" max="100" value="60">
        </div>
    </div>

    <div id="calendar-flyout" class="calendar-flyout hidden">
        <div class="cal-time" id="cal-time">--:--:--</div>
        <div class="cal-date" id="cal-date">—</div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="taskbar" id="taskbar">
        <div class="taskbar-left">
            <button class="tb-btn tb-widgets" id="tb-widgets" title="Widgety">🌤️</button>
        </div>
        <div class="taskbar-center" id="taskbar-center">
            <button class="tb-btn tb-start" id="tb-start" title="Start">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <rect x="2"  y="2"  width="9" height="9" rx="1.5" fill="currentColor"/>
                    <rect x="13" y="2"  width="9" height="9" rx="1.5" fill="currentColor"/>
                    <rect x="2"  y="13" width="9" height="9" rx="1.5" fill="currentColor"/>
                    <rect x="13" y="13" width="9" height="9" rx="1.5" fill="currentColor"/>
                </svg>
            </button>
            <button class="tb-btn" data-launch="search" title="Hledat">🔍</button>
            <div class="tb-apps" id="tb-apps"></div>
        </div>
        <div class="taskbar-right">
            <button class="tb-btn tb-tray" id="tb-tray" title="Rychlá nastavení">
                <span>📶</span><span>🔊</span><span>🔋</span>
            </button>
            <button class="tb-btn tb-clock" id="tb-clock" title="Datum a čas">
                <span id="tb-time">--:--</span>
                <span id="tb-date">—</span>
            </button>
            <button class="tb-btn tb-show-desktop" id="tb-show-desktop" title="Zobrazit plochu"></button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
</div>

<script src="windows12.js"></script>
</body>
</html>
