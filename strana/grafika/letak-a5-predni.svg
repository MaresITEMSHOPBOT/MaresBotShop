<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" role="img" aria-label="Leták ZÍTRA – přední strana"><title>ZÍTRA – leták A5, přední strana</title><defs><style>.h{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800}.b{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400}.m{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:600}</style></defs><rect width="420" height="595" fill="#0B2545"/><circle cx="420" cy="0" r="170" fill="#12A594" opacity="0.13"/><g transform="translate(36,44) scale(0.42)"><rect width="128" height="128" rx="30" fill="#0B2545"/><path d="M64 83 A17 17 0 0 1 98 83 Z" fill="#FFB020"/><g fill="#F7F4ED"><rect x="24" y="28" width="80" height="14" rx="2"/><polygon points="80,42 104,42 48,86 24,86"/><rect x="24" y="86" width="80" height="14" rx="2"/></g></g><text x="96" y="82" class="h" font-size="30" fill="#F7F4ED">ZÍTRA</text><text x="97" y="100" class="m" font-size="9" letter-spacing="2.6" fill="#C9D3E0">STÁT, KTERÝ FUNGUJE</text><text class="h" font-size="40" fill="#F7F4ED" letter-spacing="-1"><tspan x="36" y="190">Politika</tspan><tspan x="36" y="234">se dá dělat</tspan><tspan x="36" y="278" fill="#FFB020">i poctivě.</tspan></text><rect x="36" y="302" width="54" height="3" fill="#12A594"/><text x="36" y="334" class="h" font-size="15" fill="#FFB020">01</text><text x="74" y="334" class="h" font-size="17" fill="#F7F4ED">Bydlení</text><text x="74" y="351" class="b" font-size="12" fill="#C9D3E0">150 000 nájemních bytů do 10 let</text><text x="36" y="375" class="h" font-size="15" fill="#FFB020">02</text><text x="74" y="375" class="h" font-size="17" fill="#F7F4ED">Energie</text><text x="74" y="392" class="b" font-size="12" fill="#C9D3E0">levná a vlastní, ne dovážená za každou cenu</text><text x="36" y="416" class="h" font-size="15" fill="#FFB020">03</text><text x="74" y="416" class="h" font-size="17" fill="#F7F4ED">Zdraví</text><text x="74" y="433" class="b" font-size="12" fill="#C9D3E0">lékař dostupný do 30 minut</text><text x="36" y="457" class="h" font-size="15" fill="#FFB020">04</text><text x="74" y="457" class="h" font-size="17" fill="#F7F4ED">Stát</text><text x="74" y="474" class="b" font-size="12" fill="#C9D3E0">úřad online, mlčení = souhlas</text><text x="36" y="498" class="h" font-size="15" fill="#FFB020">05</text><text x="74" y="498" class="h" font-size="17" fill="#F7F4ED">Bezpečí</text><text x="74" y="515" class="b" font-size="12" fill="#C9D3E0">obrana, hranice, odolná infrastruktura</text><rect x="0" y="540" width="420" height="55" fill="#FFB020"/><text x="36" y="575" class="h" font-size="20" fill="#0B2545">zitra.cz</text><text x="384" y="575" text-anchor="end" class="m" font-size="12" fill="#0B2545">Volby do PS 2026</text></svg>
