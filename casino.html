<script>
/* ===== games/poker.js ===== */
/* ==========================================================================
   MARES CASINO – Three Card Poker (proti dealerovi, který mluví)
   Ante + Play, volitelný Pair Plus. Dealer kvalifikuje od dámy výš.
   ========================================================================== */
(function (root) {
    'use strict';
    var Casino = root.Casino = root.Casino || {};
    var fmt = Casino.util.fmt;
    function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }

    var BETS = [10, 20, 50, 100, 250, 500];
    var SUITS = ['♠', '♥', '♦', '♣'];
    var RANK_NAME = { 0: 'Vysoká karta', 1: 'Pár', 2: 'Barva', 3: 'Postupka', 4: 'Trojice', 5: 'Postupka v barvě' };
    var ANTE_BONUS = { 3: 1, 4: 4, 5: 5 };          // postupka/trojice/postupka v barvě
    var PLUS_PAY = { 1: 1, 2: 3, 3: 6, 4: 30, 5: 40 }; // Pair Plus

    function valStr(v) { return v <= 10 ? '' + v : { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[v]; }

    function deck() {
        var d = [];
        for (var s = 0; s < 4; s++) for (var v = 2; v <= 14; v++) d.push({ v: v, s: s });
        for (var i = d.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = d[i]; d[i] = d[j]; d[j] = t; }
        return d;
    }

    function evaluate(cards) {
        var vs = cards.map(function (c) { return c.v; }).sort(function (a, b) { return b - a; });
        var flush = cards[0].s === cards[1].s && cards[1].s === cards[2].s;
        var a23 = vs[0] === 14 && vs[1] === 3 && vs[2] === 2;
        var straight = (vs[0] - 1 === vs[1] && vs[1] - 1 === vs[2]) || a23;
        var sHigh = a23 ? 3 : vs[0];
        var trips = vs[0] === vs[1] && vs[1] === vs[2];
        var pairVal = 0, kicker = 0;
        if (!trips) {
            if (vs[0] === vs[1]) { pairVal = vs[0]; kicker = vs[2]; }
            else if (vs[1] === vs[2]) { pairVal = vs[1]; kicker = vs[0]; }
        }
        if (straight && flush) return { rank: 5, tb: [sHigh] };
        if (trips) return { rank: 4, tb: [vs[0]] };
        if (straight) return { rank: 3, tb: [sHigh] };
        if (flush) return { rank: 2, tb: vs };
        if (pairVal) return { rank: 1, tb: [pairVal, kicker] };
        return { rank: 0, tb: vs };
    }
    function cmp(a, b) {
        if (a.rank !== b.rank) return a.rank - b.rank;
        for (var i = 0; i < Math.max(a.tb.length, b.tb.length); i++) {
            var d = (a.tb[i] || 0) - (b.tb[i] || 0); if (d) return d;
        }
        return 0;
    }
    function qualifies(h) { return h.rank >= 1 || (h.rank === 0 && h.tb[0] >= 12); }

    var TALK = {
        deal: ['Rozdávám karty. Hodně štěstí!', 'Tři karty pro vás, tři pro mě.', 'Ať vám karta přeje!'],
        decide: ['Hrajete, nebo balíte?', 'Co na to říkáte — play, nebo fold?', 'Rozmyslete si to dobře.'],
        fold: ['Balíte. Někdy je to moudré.', 'Skládáte. Beru ante.', 'Fold. Příště to vyjde.'],
        noQual: ['Nekvalifikoval jsem se — ante vám platí.', 'Mám míň než dámu, ante hraje ve váš prospěch.'],
        win: ['Vyhráváte! Gratuluji.', 'Pěkná ruka, berete to!', 'To je výhra, klobouk dolů!'],
        lose: ['Dům bere. Příště!', 'Tentokrát mám lepší ruku.', 'Beru to já, smůla.'],
        push: ['Shoda — nikdo nebere.', 'Remíza, sázky se vrací.'],
        plus: ['A Pair Plus vám taky platí!', 'Bonus Pair Plus letí k vám!']
    };
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    Casino.Poker = { open: function (mount, opts) { return new Poker(mount, opts); } };

    function Poker(mount, opts) {
        this.opts = opts || {};
        this.betIndex = 2;
        this.pairPlus = false;
        this.state = 'idle';
        this.destroyed = false;
        this.build(mount);
    }
    Poker.prototype.ante = function () { return BETS[this.betIndex]; };

    Poker.prototype.build = function (mount) {
        var self = this;
        var theme = { a: '#19a86b', b: '#ffd24a', bg: 'radial-gradient(circle at 50% 0%, #0a3b2a, #04130d)' };
        var f = Casino.UI.gameFrame(mount, {
            emoji: '🃏', name: 'Three Card Poker', subtitle: 'Tři karty proti živému dealerovi',
            theme: theme, bg: theme.bg, onExit: function () { Casino.Dealer.stop(); self.opts.onExit && self.opts.onExit(); },
            onInfo: function () { self.info(); }
        });
        this.frame = f;

        var stage = f.stage;
        var dealerRow = el('div', 'poker-dealer');
        dealerRow.innerHTML = '<div class="dealer-av">🤵</div><div class="speech hidden"></div>';
        stage.appendChild(dealerRow);
        this.speech = dealerRow.querySelector('.speech');

        this.dealerCards = el('div', 'card-row dealer-cards'); stage.appendChild(this.labelRow('Dealer', this.dealerCards));
        this.result = el('div', 'poker-result'); stage.appendChild(this.result);
        this.playerCards = el('div', 'card-row player-cards'); stage.appendChild(this.labelRow('Ty', this.playerCards));

        var c = f.controls;
        c.innerHTML =
            '<div class="ctrl-cell ctrl-bet"><button class="bet-dn">−</button>' +
            '<div class="bet-val"><label>Ante</label><b class="c-bet">' + fmt(this.ante()) + '</b></div>' +
            '<button class="bet-up">+</button></div>' +
            '<label class="auto-cash pp-toggle"><input type="checkbox" class="pp"> Pair Plus</label>' +
            '<div class="poker-actions">' +
            '<button class="deal-btn">ROZDAT 🃏</button>' +
            '<button class="fold-btn hidden">SLOŽIT</button>' +
            '<button class="play-btn hidden">HRÁT</button>' +
            '</div>';
        this.betEl = c.querySelector('.c-bet');
        c.querySelector('.bet-dn').onclick = function () { self.changeBet(-1); };
        c.querySelector('.bet-up').onclick = function () { self.changeBet(1); };
        c.querySelector('.pp').onchange = function (e) { self.pairPlus = e.target.checked; };
        this.dealBtn = c.querySelector('.deal-btn');
        this.foldBtn = c.querySelector('.fold-btn');
        this.playBtn = c.querySelector('.play-btn');
        this.dealBtn.onclick = function () { Casino.Sound.unlock(); self.deal(); };
        this.foldBtn.onclick = function () { self.fold(); };
        this.playBtn.onclick = function () { self.play(); };

        this.renderCards(this.dealerCards, null, 3);
        this.renderCards(this.playerCards, null, 3);
        Casino.Dealer.say(this.speech, 'Vítejte u stolu! Vsaďte ante a rozdáme.');
    };

    Poker.prototype.labelRow = function (label, cardsEl) {
        var w = el('div', 'card-area'); w.appendChild(el('div', 'card-area-label', label)); w.appendChild(cardsEl); return w;
    };

    Poker.prototype.changeBet = function (d) {
        if (this.state !== 'idle') return;
        var n = this.betIndex + d; if (n < 0 || n >= BETS.length) return;
        this.betIndex = n; Casino.Sound.click(); this.betEl.textContent = fmt(this.ante());
    };

    Poker.prototype.renderCards = function (container, cards, count) {
        container.innerHTML = '';
        for (var i = 0; i < count; i++) {
            var c = el('div', 'pcard down');
            if (cards && cards[i]) { c = this.faceCard(cards[i]); }
            container.appendChild(c);
        }
    };
    Poker.prototype.faceCard = function (card) {
        var red = card.s === 1 || card.s === 2;
        var c = el('div', 'pcard' + (red ? ' red' : ''));
        c.innerHTML = '<span class="pc-v">' + valStr(card.v) + '</span><span class="pc-s">' + SUITS[card.s] + '</span>';
        return c;
    };

    Poker.prototype.deal = function () {
        var ante = this.ante();
        var cost = ante + (this.pairPlus ? ante : 0);
        if (!Casino.Account.debit(cost)) { Casino.UI.toast('Nedostatek kreditu!', ''); if (this.opts.onBroke) this.opts.onBroke(); return; }
        this.anteAmt = ante; this.ppAmt = this.pairPlus ? ante : 0;
        var d = deck();
        this.player = [d.pop(), d.pop(), d.pop()];
        this.dealer = [d.pop(), d.pop(), d.pop()];
        this.state = 'decide';
        this.result.textContent = '';
        Casino.Sound.click();

        this.renderCards(this.dealerCards, null, 3);
        // postupně otoč hráčské karty
        var self = this;
        this.renderCards(this.playerCards, null, 3);
        this.player.forEach(function (card, i) {
            setTimeout(function () {
                if (self.destroyed) return;
                self.playerCards.children[i].replaceWith(self.faceCard(card));
                Casino.Sound.reelStop(i);
            }, 180 * (i + 1));
        });
        this.dealBtn.classList.add('hidden');
        this.foldBtn.classList.remove('hidden');
        this.playBtn.classList.remove('hidden');
        setTimeout(function () { if (!self.destroyed) Casino.Dealer.say(self.speech, pick(TALK.decide)); }, 800);
    };

    Poker.prototype.revealDealer = function () {
        var self = this;
        this.dealer.forEach(function (card, i) {
            setTimeout(function () {
                if (self.destroyed) return;
                self.dealerCards.children[i].replaceWith(self.faceCard(card));
                Casino.Sound.reelStop(i + 1);
            }, 160 * i);
        });
    };

    Poker.prototype.resolvePairPlus = function (ph) {
        if (!this.ppAmt) return 0;

    Poker.prototype.fold = function () {

        var ph = evaluate(this.player);
        var ppReturn = this.resolvePairPlus(ph);   // Pair Plus se řeší dle tvých karet
        if (ppReturn > 0) Casino.Account.credit(ppReturn);
        Casino.Account.recordSpin('poker', this.anteAmt + this.ppAmt, ppReturn);
        this.revealDealer();
        Casino.Dealer.say(this.speech, pick(TALK.fold) + (ppReturn > 0 ? ' Ale Pair Plus platí!' : ''));
        this.showResult('Složil jsi. ' + (ppReturn > 0 ? 'Pair Plus +' + fmt(ppReturn) : 'Ante propadá.'), ppReturn > 0);
        this.endHand();
    };

    Poker.prototype.play = function () {
        if (this.state !== 'decide') return;
        var play = this.anteAmt;
        if (!Casino.Account.debit(play)) { Casino.UI.toast('Nedostatek kreditu na Play sázku!', ''); return; }
        this.state = 'reveal';
        this.revealDealer();
        var self = this;

    };

    Poker.prototype.showdown = function (play) {

        if (!dq) {
            mainReturn = this.anteAmt * 2 + play; // ante 1:1, play push
            outcome = 'Dealer nekvalifikoval (' + RANK_NAME[dh.rank] + '). Ante platí 1:1, Play se vrací.';
            win = true;
            Casino.Dealer.say(this.speech, pick(TALK.noQual));
        } else {
            var r = cmp(ph, dh);
            if (r > 0) { mainReturn = this.anteAmt * 2 + play * 2; outcome = 'Tvá ' + RANK_NAME[ph.rank] + ' poráží dealerovu ' + RANK_NAME[dh.rank] + '!'; win = true; Casino.Dealer.say(this.speech, pick(TALK.win)); }
            else if (r === 0) { mainReturn = this.anteAmt + play; outcome = 'Shoda — sázky se vrací.'; Casino.Dealer.say(this.speech, pick(TALK.push)); }
            else { mainReturn = 0; outcome = 'Dealerova ' + RANK_NAME[dh.rank] + ' bere nad tvou ' + RANK_NAME[ph.rank] + '.'; Casino.Dealer.say(this.speech, pick(TALK.lose)); }
        }
        var bonusMult = ANTE_BONUS[ph.rank] || 0;
        var bonus = bonusMult ? this.anteAmt * bonusMult : 0;
        var ppReturn = this.resolvePairPlus(ph);
        var totalReturn = mainReturn + bonus + ppReturn;
        if (totalReturn > 0) Casino.Account.credit(totalReturn);
        Casino.Account.recordSpin('poker', this.anteAmt + play + this.ppAmt, totalReturn);

        var extra = [];
        if (bonus) extra.push('Ante bonus +' + fmt(bonus) + ' (' + RANK_NAME[ph.rank] + ')');
        if (ppReturn) extra.push('Pair Plus +' + fmt(ppReturn));
        var net = totalReturn - (this.anteAmt + play + this.ppAmt);
        this.showResult(outcome + (extra.length ? ' · ' + extra.join(' · ') : '') + '  →  ' + (net >= 0 ? '+' : '') + fmt(net), net >= 0);
        if (net > 0) Casino.Sound.win(net >= this.anteAmt * 4 ? 3 : 2); else if (net === 0) Casino.Sound.win(0); else Casino.Sound.lose();

        this.endHand();
    };

        this.result.textContent = txt;
        this.result.className = 'poker-result show ' + (good ? 'good' : 'bad');
    };
    Poker.prototype.endHand = function () {
        this.foldBtn.classList.add('hidden');
        this.playBtn.classList.add('hidden');
        this.dealBtn.classList.remove('hidden');
    };

    Poker.prototype.info = function () {
        Casino.UI.modal({
            title: '🃏 Three Card Poker — pravidla',
            body: '<p style="color:var(--muted);line-height:1.7">Vsadíš <b>Ante</b> a dostaneš 3 karty (dealer taky). Pak se rozhodneš <b>HRÁT</b> (přidáš stejnou Play sázku) nebo <b>SLOŽIT</b>.</p>' +
                '<ul style="color:var(--muted);line-height:1.8;margin-left:18px">' +
                '<li>Dealer kvalifikuje od <b>dámy</b> výš.</li>' +
                '<li>Nekvalifikuje → Ante platí 1:1, Play se vrací.</li>' +
                '<li>Kvalifikuje → porovnání rukou (výhra 1:1 na obě sázky).</li>' +
                '<li><b>Ante bonus:</b> postupka 1:1, trojice 4:1, postupka v barvě 5:1.</li>' +
                '<li><b>Pair Plus</b> (volitelně): pár 1:1, barva 3:1, postupka 6:1, trojice 30:1, postupka v barvě 40:1.</li></ul>' +
                '<p style="color:var(--muted);margin-top:8px">Pořadí rukou: postupka v barvě > trojice > postupka > barva > pár > vysoká karta.</p>'

    };

    Poker.prototype.destroy = function () { this.destroyed = true; Casino.Dealer.stop(); };

    Casino.registry.push({
        id: 'poker', name: 'Three Card Poker', emoji: '🃏', category: 'table',
        tagline: 'Tři karty proti dealerovi, který mluví',
        theme: { a: '#19a86b', b: '#ffd24a', bg: 'radial-gradient(circle at 50% 0%, #0a3b2a, #04130d)' },
        badges: ['RTP ~96.6%', 'Stolní'], meta: 'Živý dealer · Pair Plus 40:1',
        open: function (mount, opts) { return Casino.Poker.open(mount, opts); }
    });

})(typeof window !== 'undefined' ? window : global);

<script>
/* ===== app.js ===== */
/* ==========================================================================
   MARES CASINO – aplikace: přihlášení, lobby, navigace, hlavička, bonusy
   ========================================================================== */
(function (root) {
    'use strict';
    var Casino = root.Casino = root.Casino || {};
    var Account = Casino.Account, fmt = Casino.util.fmt, GAMES = Casino.GAMES;

    function $(s, p) { return (p || document).querySelector(s); }
    function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

    /* ======================================================================

    Casino.UI = {

            var card = el('div', 'modal-card');

            close.onclick = destroy;

        },

            setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 2600);
        },
        // společný rámec pro ne-slotové hry (horní lišta + stage + ovládání)
        gameFrame: function (mount, opts) {

            if (opts.theme) { root.style.setProperty('--accent', opts.theme.a); root.style.setProperty('--accent2', opts.theme.b); }
            var top = el('div', 'machine-top');

            back.onclick = function () { Casino.Sound.click(); if (opts.onExit) opts.onExit(); };
            var title = el('div', 'machine-title', '<span class="m-emoji">' + opts.emoji + '</span><span><b>' + opts.name + '</b><small>' + (opts.subtitle || '') + '</small></span>');
            top.appendChild(back); top.appendChild(title);
            if (opts.onInfo) { var ib = el('button', 'btn-ghost', 'ℹ️ Info'); ib.onclick = function () { Casino.Sound.click(); opts.onInfo(); }; top.appendChild(ib); }
            var stage = el('div', 'tg-stage'); if (opts.bg) stage.style.background = opts.bg;
            var controls = el('div', 'tg-controls');
            root.appendChild(top); root.appendChild(stage); root.appendChild(controls);
            mount.innerHTML = ''; mount.appendChild(root);
            return { root: root, top: top, stage: stage, controls: controls };
        }
    };

    /* ======================================================================
       Hlavička + kredit
       ===================================================================== */
    function animateBalance(to) {
        var node = $('#hdr-balance'); if (!node) return;
        var from = parseFloat(node.dataset.v || '0') || 0;
        node.dataset.v = to;
        var chip = $('#balance-chip');
        if (chip) { chip.classList.remove('up', 'down'); void chip.offsetWidth; chip.classList.add(to >= from ? 'up' : 'down'); }
        var start = performance.now(), dur = 650;
        function frame(now) {
            var p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
            node.textContent = fmt(from + (to - from) * e);
            if (p < 1) requestAnimationFrame(frame); else node.textContent = fmt(to);

        requestAnimationFrame(frame);
    }

    function refreshHeader() {
        var a = Account.current();
        $('#topbar').classList.toggle('hidden', !a);
        if (!a) return;
        $('#hdr-name').textContent = a.name;
        animateBalance(a.balance);
        refreshBonusBtn();
    }

    function refreshBonusBtn() {
        var st = Account.bonusState();
        var btn = $('#btn-bonus');
        if (!btn) return;
        var hot = st.daily || st.rescue;
        btn.classList.toggle('hot', hot);
        btn.innerHTML = '🎁 Bonus' + (hot ? ' <span class="dot"></span>' : '');
    }

    /* ======================================================================
       Obrazovky
       ===================================================================== */
    function show(screen) {
        ['login', 'lobby', 'game'].forEach(function (s) {
            $('#screen-' + s).classList.toggle('hidden', s !== screen);
        });
        $('#btn-lobby').classList.toggle('hidden', screen !== 'game');
    }

    /* ---------- Přihlášení ---------- */
    function renderLogin() {
        var scr = $('#screen-login');
        scr.innerHTML = '';
        var box = el('div', 'login-box');
        box.appendChild(el('div', 'login-logo', '🎰'));
        box.appendChild(el('h1', null, 'MARES CASINO'));
        box.appendChild(el('p', 'login-sub', 'Roztoč automaty a sbírej kredity. Vytvoř si účet nebo pokračuj.'));

        var accs = Account.listAccounts();
        if (accs.length) {
            var list = el('div', 'acc-list');
            list.appendChild(el('div', 'acc-list-title', 'Tvé účty'));
            accs.forEach(function (a) {
                var row = el('button', 'acc-row');
                row.innerHTML = '<span class="acc-av">' + a.name.charAt(0).toUpperCase() + '</span>' +
                    '<span class="acc-meta"><b>' + a.name + '</b><small>🪙 ' + fmt(a.balance) + ' · ' + a.stats.spins + ' zatočení</small></span>' +
                    '<span class="acc-go">▶</span>';
                row.onclick = function () { Casino.Sound.unlock(); doLogin(a.name); };
                var del = el('button', 'acc-del', '🗑');
                del.title = 'Smazat účet';
                del.onclick = function (e) {
                    e.stopPropagation();
                    Casino.UI.modal({
                        title: 'Smazat účet?', body: 'Opravdu smazat účet <b>' + a.name + '</b> a jeho kredit?',
                        actions: [{ label: 'Zrušit' }, { label: 'Smazat', primary: true, onClick: function () { Account.deleteAccount(a.name); renderLogin(); } }]
                    });
                };
                var wrap = el('div', 'acc-row-wrap'); wrap.appendChild(row); wrap.appendChild(del);
                list.appendChild(wrap);
            });
            box.appendChild(list);
            box.appendChild(el('div', 'or-divider', '<span>nebo nový účet</span>'));
        }

        var form = el('form', 'login-form');
        var input = el('input', 'login-input');
        input.placeholder = 'Zadej přezdívku…'; input.maxLength = 18;
        var btn = el('button', 'btn-primary login-btn', 'Vytvořit účet a hrát ▶');
        form.appendChild(input); form.appendChild(btn);
        form.onsubmit = function (e) {
            e.preventDefault();
            Casino.Sound.unlock();
            var name = input.value.trim() || ('Hráč' + Casino.util.randInt(100, 999));
            doLogin(name);
        };
        box.appendChild(form);
        box.appendChild(el('p', 'login-note', '🎮 Hra je čistě pro zábavu, za virtuální kredity bez jakékoliv reálné hodnoty. Nový účet startuje s 5 000 kredity.'));
        scr.appendChild(box);
    }

    function doLogin(name) {
        var fresh = !Account.listAccounts().some(function (a) { return a.name === name; });
        Account.login(name);
        refreshHeader();
        goLobby();
        if (fresh) Casino.UI.toast('Vítej, ' + name + '! Máš 5 000 kreditů na startenku. 🎉', 'good');
        else Casino.UI.toast('Vítej zpět, ' + name + '! 👋', 'good');
        // nabídni denní bonus
        var st = Account.bonusState();
        if (st.daily) setTimeout(openBonus, 600);
    }

    /* ---------- Lobby ---------- */
    function gameTypeLabel(g) {
        if (g.type === 'tumble') return g.reels + '×' + g.rows + ' · padající symboly';
        return g.reels + '×' + g.rows + ' · ' + g.paylines.length + ' linií';
    }

    var CATS = [
        { id: 'slots', label: '🎰 Automaty' },
        { id: 'arcade', label: '🕹️ Arkády & rychlovky' },
        { id: 'table', label: '🃏 Stolní hry' }
    ];

    // jednou zaregistruj sloty do katalogu (ostatní hry se registrují samy při načtení)
    function registerSlots() {
        if (Casino._slotsReg) return; Casino._slotsReg = true;
        GAMES.forEach(function (g) {
            Casino.registry.unshift({
                id: g.id, name: g.name, emoji: g.emoji, tagline: g.tagline, category: 'slots', theme: g.theme,
                badges: ['RTP ' + g.rtp + '%', g.volatility],
                meta: gameTypeLabel(g) + (g.freeSpins ? ' · 🎁 free spins' : ''),
                open: (function (game) { return function (mount, opts) { return Casino.Slot.open(game, mount, opts); }; })(g)
            });
        });
        // zachovej pořadí slotů dle GAMES (unshift je obrátil)
        Casino.registry.sort(function (a, b) {
            var ai = a.category === 'slots' ? GAMES.findIndex(function (g) { return g.id === a.id; }) : 999;
            var bi = b.category === 'slots' ? GAMES.findIndex(function (g) { return g.id === b.id; }) : 999;
            return ai - bi;
        });
    }

    function goLobby() { renderLobby(); show('lobby'); }

    function makeCard(entry) {
        var card = el('button', 'game-card');
        card.style.setProperty('--a', entry.theme.a);
        card.style.setProperty('--b', entry.theme.b);
        card.style.background = entry.theme.bg;
        var badges = (entry.badges || []).map(function (b, i) { return '<span class="' + (i === 0 ? 'gc-rtp' : 'gc-vol') + '">' + b + '</span>'; }).join('');
        card.innerHTML =
            '<div class="gc-badges">' + badges + '</div>' +
            '<div class="gc-emoji">' + entry.emoji + '</div>' +
            '<div class="gc-name">' + entry.name + '</div>' +
            '<div class="gc-tag">' + entry.tagline + '</div>' +
            '<div class="gc-meta">' + (entry.meta || '') + '</div>' +
            '<div class="gc-play">HRÁT ▶</div>';
        card.onclick = function () { Casino.Sound.unlock(); Casino.Sound.click(); openGame(entry); };
        return card;
    }

    function renderLobby() {
        var a = Account.current(); if (!a) return;
        var scr = $('#screen-lobby');
        scr.innerHTML = '';

        var hero = el('div', 'lobby-hero');
        hero.innerHTML =
            '<div class="hero-text"><h1>Ahoj, ' + a.name + '! 🎰</h1>' +
            '<p>Vyber si z ' + Casino.registry.length + ' her — automaty, arkády i stolní hry. Hodně zdaru!</p></div>' +
            '<div class="hero-stats">' +
            '<div class="hs"><label>Kredit</label><b>🪙 ' + fmt(a.balance) + '</b></div>' +
            '<div class="hs"><label>Zatočení</label><b>' + fmt(a.stats.spins) + '</b></div>' +
            '<div class="hs"><label>Největší výhra</label><b>' + fmt(a.stats.biggest) + '</b></div>' +
            '</div>';
        scr.appendChild(hero);

        CATS.forEach(function (cat) {
            var entries = Casino.registry.filter(function (e) { return e.category === cat.id; });
            if (!entries.length) return;
            scr.appendChild(el('h2', 'section-title', cat.label));
            var grid = el('div', 'game-grid');
            entries.forEach(function (e) { grid.appendChild(makeCard(e)); });
            scr.appendChild(grid);
        });

        // poslední výhry
        if (a.history && a.history.length) {
            scr.appendChild(el('h2', 'section-title', '🏆 Tvé poslední výhry'));
            var ticker = el('div', 'win-ticker');
            a.history.slice(0, 12).forEach(function (h) {
                var m = Casino.metaById(h.g);
                ticker.appendChild(el('div', 'wt-item', (m ? m.emoji : '🎰') + ' <b>+' + fmt(h.win) + '</b> <small>' + (m ? m.name : '') + '</small>'));
            });
            scr.appendChild(ticker);
        }

        scr.appendChild(el('p', 'lobby-disclaimer',
            '⚠️ Pouze pro zábavu — hraje se za virtuální kredity bez reálné hodnoty. Žádné skutečné peníze.'));
    }

    /* ---------- Hra ---------- */
    var currentMachine = null;
    function closeGame() { if (currentMachine && currentMachine.destroy) currentMachine.destroy(); currentMachine = null; }
    function openGame(entry) {
        show('game');
        var mount = $('#machine-mount');
        closeGame();
        currentMachine = entry.open(mount, {
            onExit: function () { closeGame(); goLobby(); },
            onBroke: function () { openBonus(); }
        });
    }

    /* ======================================================================
       Bonus
       ===================================================================== */
    function openBonus() {
        var st = Account.bonusState();
        var body = el('div', 'bonus-box');
        var html = '<p>Tvůj kredit: <b>🪙 ' + fmt(Account.getBalance()) + '</b></p>';
        body.innerHTML = html;

        var dailyBtn = el('button', 'bonus-claim' + (st.daily ? '' : ' done'),
            st.daily ? '🎁 Denní bonus: +' + fmt(st.dailyAmount) : '✓ Denní bonus vyzvednut');
        dailyBtn.disabled = !st.daily;
        dailyBtn.onclick = function () {
            var got = Account.claimDaily();
            if (got) { refreshHeader(); Casino.UI.toast('Denní bonus +' + fmt(got) + ' 🎉', 'good'); Casino.Sound.win(2); }
            dailyBtn.disabled = true; dailyBtn.classList.add('done'); dailyBtn.textContent = '✓ Denní bonus vyzvednut';
            refreshBonusBtn();
        };
        body.appendChild(dailyBtn);

        if (!st.daily) {
            var h = Math.ceil(st.dailyIn / 3600000);
            body.appendChild(el('p', 'bonus-timer', 'Další denní bonus za ~' + h + ' h.'));
        }

        var rescueBtn = el('button', 'bonus-claim' + (st.rescue ? '' : ' done'),
            st.rescue ? '🆘 Záchranný balíček: +' + fmt(st.rescueAmount) : 'Záchrana dostupná pod ' + fmt(500) + ' kredity');
        rescueBtn.disabled = !st.rescue;
        rescueBtn.onclick = function () {
            var got = Account.claimRescue();
            if (got) { refreshHeader(); Casino.UI.toast('Záchranný balíček +' + fmt(got) + ' 💪', 'good'); Casino.Sound.win(1); }
            rescueBtn.disabled = true; rescueBtn.classList.add('done');
            refreshBonusBtn();
        };
        body.appendChild(rescueBtn);
        body.appendChild(el('p', 'bonus-note', 'Bonusy zajišťují, že si vždycky můžeš zahrát dál. 😉'));

        Casino.UI.modal({ title: '🎁 Bonusy', body: body });
    }

    /* ======================================================================
       Statistiky
       ===================================================================== */
    function openStats() {
        var a = Account.current(); if (!a) return;
        var s = a.stats;
        var net = s.won - s.wagered;
        var body = el('div', 'stats-box');
        body.innerHTML =
            '<div class="stat-grid">' +
            '<div class="st"><label>Zatočení</label><b>' + fmt(s.spins) + '</b></div>' +
            '<div class="st"><label>Vsazeno</label><b>' + fmt(s.wagered) + '</b></div>' +
            '<div class="st"><label>Vyhráno</label><b>' + fmt(s.won) + '</b></div>' +
            '<div class="st"><label>Bilance</label><b class="' + (net >= 0 ? 'pos' : 'neg') + '">' + (net >= 0 ? '+' : '') + fmt(net) + '</b></div>' +
            '<div class="st"><label>Největší výhra</label><b>' + fmt(s.biggest) + '</b></div>' +
            '<div class="st"><label>Kredit</label><b>🪙 ' + fmt(a.balance) + '</b></div>' +
            '</div>';
        var byGame = Object.keys(s.byGame);
        if (byGame.length) {
            var tbl = el('table', 'stats-table');
            tbl.innerHTML = '<thead><tr><th>Hra</th><th>Kol</th><th>Bilance</th></tr></thead>';
            var tb = el('tbody');
            byGame.forEach(function (id) {
                var m = Casino.metaById(id), gg = s.byGame[id], n = gg.won - gg.wagered;
                var tr = el('tr', null, '<td>' + (m ? m.emoji + ' ' + m.name : id) + '</td><td>' + fmt(gg.spins) +
                    '</td><td class="' + (n >= 0 ? 'pos' : 'neg') + '">' + (n >= 0 ? '+' : '') + fmt(n) + '</td>');
                tb.appendChild(tr);
            });
            tbl.appendChild(tb);
            body.appendChild(el('h4', null, 'Podle hry'));
            body.appendChild(tbl);
        }
        Casino.UI.modal({ title: '📊 Statistiky — ' + a.name, body: body });
    }

    /* ======================================================================
       Účet menu
       ===================================================================== */
    function openUserMenu() {
        var a = Account.current();
        var body = el('div', 'user-menu');
        body.innerHTML = '<p>Přihlášen jako <b>' + a.name + '</b></p>';
        var bSwitch = el('button', 'btn-secondary', '🔁 Přepnout / nový účet');
        bSwitch.onclick = function () { m.close(); Account.logout(); refreshHeader(); renderLogin(); show('login'); };
        var bLogout = el('button', 'btn-secondary', '🚪 Odhlásit se');
        bLogout.onclick = function () { m.close(); Account.logout(); refreshHeader(); renderLogin(); show('login'); };
        body.appendChild(bSwitch); body.appendChild(bLogout);
        var m = Casino.UI.modal({ title: '👤 Účet', body: body });
    }

    /* ======================================================================
       Init
       ===================================================================== */
    function init() {
        Account.init();
        registerSlots();

        // hlavička – tlačítka
        $('#brand').onclick = function () { if (Account.isLoggedIn()) { closeGame(); goLobby(); } };
        $('#btn-lobby').onclick = function () { Casino.Sound.click(); closeGame(); goLobby(); };
        $('#btn-bonus').onclick = function () { Casino.Sound.unlock(); Casino.Sound.click(); openBonus(); };
        $('#btn-stats').onclick = function () { Casino.Sound.click(); openStats(); };
        $('#btn-user').onclick = function () { Casino.Sound.click(); openUserMenu(); };

        // aktualizace kreditu při změně
        Casino.bus.on('balance', function (b) { animateBalance(b); });

        // odemkni zvuk na první interakci
        var unlock = function () { Casino.Sound.unlock(); document.removeEventListener('pointerdown', unlock); };
        document.addEventListener('pointerdown', unlock);

        if (Account.isLoggedIn()) { refreshHeader(); goLobby(); }
        else { renderLogin(); show('login'); }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();

})(typeof window !== 'undefined' ? window : global);

</script>
</body>
</html>
