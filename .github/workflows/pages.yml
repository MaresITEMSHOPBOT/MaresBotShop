# Publikuje obsah repozitáře na GitHub Pages, aby šla aplikace
# spotreba.html otevřít přes https a nainstalovat na plochu.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/article-expiry-tracking-app-4tr5az]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true zapne GitHub Pages, pokud ještě zapnuté nejsou.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
