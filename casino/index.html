<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <title>🎰 Mares Casino — Online automaty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- animované pozadí -->
    <div class="bg-fx">
        <div class="bg-orb o1"></div>
        <div class="bg-orb o2"></div>
        <div class="bg-orb o3"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- hlavička -->
    <header id="topbar" class="hidden">
        <div class="brand" id="brand"><span class="brand-ico">🎰</span> MARES<span class="brand-accent">CASINO</span></div>
        <div class="topbar-mid">
            <button id="btn-lobby" class="btn-ghost hidden">← Lobby</button>
        </div>
        <div class="topbar-right">
            <button id="btn-bonus" class="bonus-btn">🎁 Bonus</button>
            <div class="balance-chip" id="balance-chip">🪙 <b id="hdr-balance">0</b></div>
            <button id="btn-stats" class="icon-btn" title="Statistiky">📊</button>
            <button id="btn-user" class="user-btn"><span id="hdr-name"></span> ▾</button>
        </div>
    </header>

    <main id="app">
        <section id="screen-login" class="screen"></section>
        <section id="screen-lobby" class="screen hidden"></section>
        <section id="screen-game" class="screen hidden">
            <div id="machine-mount"></div>
        </section>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="audio.js"></script>
    <script src="account.js"></script>
    <script src="slot.js"></script>
    <script src="app.js"></script>
</body>
</html>
